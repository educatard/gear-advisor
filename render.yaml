services:
  - type: web
    name: gear-advisor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADVISOR_MODEL
        value: claude-sonnet-5-5
      - key: RATE_PER_MINUTE
        value: "12"
      - key: RATE_PER_HOUR
        value: "80"
      - key: PYTHON_VERSION
        value: 3.13.0
