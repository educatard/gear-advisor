<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Thomann Gear Advisor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap">
<style>
/* Layout: a shop in Thomann's visual language (black bar, white nav with pill search, results list, product page),
   with the purple Live-chat widget docked bottom right. Single light theme by choice, matching the shop. */
:root{
  --ink:#1f1f1f; --bg:#ffffff; --soft:#f3f3f3; --soft2:#f7f7f8; --line:#e8e8e8; --muted:#686868;
  --black:#000000; --purple:#7e00f3; --purple-2:#a24bff; --purple-soft:#f2e6fe; --purple-light:#c9a3f7;
  --bubble:#e0e3ea; --ok:#1d8a3a; --warn:#a85f00; --bad:#c62828; --ok-soft:#e3f4e8; --warn-soft:#fdf0dc; --bad-soft:#fde4e4;
  --teal:#00a19a; --sil:#d4d4d8; --sil2:#bdbdc4;
  --f:"Open Sans",Verdana,Tahoma,Arial,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* top bars */
.promo{background:var(--purple-soft);text-align:center;font-size:13px;padding-block:7px}
.promo b{color:var(--purple)}
.topbar{background:var(--black);color:#fff}
.topbar .wrap{display:flex;align-items:center;gap:16px;height:44px}
.wm{font-weight:800;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:6px;white-space:nowrap}
.wm small{font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.7}
.wm-real{display:none}
body[data-brand="lookalike"] .wm-real{display:inline-flex;align-items:center}
body[data-brand="lookalike"] .wm-neutral{display:none}
.wm-real .dot{width:9px;height:9px;border-radius:50%;background:var(--teal);display:inline-block;margin:0 1px;transform:translateY(2px)}
.topbar .usp{flex:1;text-align:center;font-weight:700;font-size:13px}
.topbar .links{display:flex;gap:18px;font-size:13px;font-weight:600}
.nav2{border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.nav2 .wrap{display:flex;align-items:center;gap:20px;height:62px}
.menu-btn{font-weight:700;font-size:16px;display:flex;align-items:center;gap:4px;position:relative}
.searchbox{flex:1;max-width:420px;margin:0 auto;position:relative}
.searchbox form{display:flex;align-items:center;border:1.5px solid var(--ink);border-radius:30px;padding:0 14px;height:42px;background:var(--bg)}
.searchbox form:focus-within{border-color:var(--purple);box-shadow:0 0 0 1px var(--purple)}
.searchbox input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:14.5px}
.ac{position:absolute;left:-10px;right:-10px;top:48px;background:var(--bg);border-radius:0 0 10px 10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:10px 0 12px;border-bottom:3px solid var(--purple);z-index:30}
.ac .grp{font-weight:700;font-size:14px;padding:8px 20px 2px;text-decoration:underline;text-decoration-color:var(--teal);text-decoration-thickness:3px;text-underline-offset:5px}
.ac button{display:block;width:100%;text-align:left;padding:6px 20px;font-size:14.5px}
.ac button:hover,.ac button.sel{background:var(--soft)}
.ac .askrow{display:flex;gap:10px;align-items:center;margin:0 10px 6px;width:auto;border-radius:10px;background:var(--purple-soft);padding:10px 12px}
.ac .askrow b{color:var(--purple)}
.icons{display:flex;gap:22px;align-items:center}
.iconbtn{position:relative;display:inline-flex}
.badge-n{position:absolute;top:-6px;right:-9px;background:var(--purple);color:#fff;font-size:10.5px;font-weight:700;border-radius:9px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
.dd{position:absolute;top:44px;background:var(--bg);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:8px 0;min-width:220px;z-index:40}
.dd button{display:flex;gap:10px;align-items:center;width:100%;padding:9px 16px;text-align:left;font-size:14.5px}
.dd button:hover{background:var(--soft)}

/* generic */
.pill{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--ink);border-radius:40px;padding:9px 18px;font-weight:700;font-size:15px;background:var(--bg)}
.pill:hover{background:var(--soft)}
.pill.purple{border-color:var(--purple);color:var(--purple)}
.pill.purple:hover{background:var(--purple-soft)}
.cta{background:var(--black);color:#fff;border-radius:50px;font-weight:700;padding:12px 28px;font-size:15px;text-transform:uppercase}
.cta:hover{background:#333}
.cta.purple{background:var(--purple);text-transform:none}
.cta.purple:hover{background:#6a00cc}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;font-size:12.5px;margin:16px 0 10px}
.crumbs span{background:var(--soft);padding:3px 10px;clip-path:polygon(0 0,calc(100% - 7px) 0,100% 50%,calc(100% - 7px) 100%,0 100%,7px 50%)}
.crumbs span:first-child{clip-path:polygon(0 0,calc(100% - 7px) 0,100% 50%,calc(100% - 7px) 100%,0 100%);border-radius:4px 0 0 4px}
.crumbs span.last{background:none}
.stars{letter-spacing:1px;font-size:14px;white-space:nowrap}
.st5{background:linear-gradient(90deg,var(--ink) var(--r),#c8c8c8 var(--r));-webkit-background-clip:text;background-clip:text;color:transparent}
.stars em{font-style:normal;color:var(--purple);font-size:13px;letter-spacing:0;margin-left:4px;text-decoration:underline}
.instock{color:var(--ok);font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.instock::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.instock.low{color:var(--warn)}.instock.out{color:var(--bad)}
.muted{color:var(--muted);font-size:13px}
.sil{background:var(--soft2);border-radius:8px;display:grid;place-items:center;aspect-ratio:4/3;max-width:100%}
.sil svg{width:70%;height:auto}

/* results */
h1.page{font-size:clamp(28px,4vw,40px);font-weight:800;margin:6px 0 4px;line-height:1.1;text-wrap:balance;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1.page .cnt{font-size:20px;color:var(--muted);font-weight:700}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0 16px;flex-wrap:wrap}
.toolbar select{border:0;font-weight:600;background:none}
.res{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;padding-bottom:80px}
.filters h3{font-size:15px;margin:0 0 8px}
.filters label{display:flex;gap:10px;align-items:center;font-size:14px;padding:3px 0;cursor:pointer}
.filters input[type=checkbox]{width:18px;height:18px;accent-color:var(--purple)}
.filters .blk{margin-bottom:22px}
.filters .range{display:flex;gap:8px}
.filters .range input{width:100%;min-width:0;border:1px solid var(--ink);border-radius:8px;padding:6px 8px}
.list{display:flex;flex-direction:column;gap:12px;min-width:0}
.row{background:var(--soft);border-radius:10px;padding:14px;display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:18px;cursor:pointer}
.row:hover{box-shadow:0 0 0 1.5px var(--line) inset;background:#eeeeef}
.row .sil{aspect-ratio:4/3}
.row h2{font-size:16px;margin:0 0 2px;font-weight:400}
.row h2 b{font-weight:700}
.row ul{margin:6px 0;padding-left:18px;font-size:13.5px}
.row ul li{list-style:circle}
.row .side{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:8px}
.row .big{font-size:22px;font-weight:800;white-space:nowrap}
.row .acts{display:flex;gap:12px}
.flag{background:var(--purple);color:#fff;font-size:11px;font-weight:800;padding:2px 7px;border-radius:3px;text-transform:uppercase}
.askstrip{border:1.5px dashed var(--purple);background:var(--purple-soft);border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.askstrip p{margin:0;flex:1;min-width:200px;font-size:14px}
.filterbtn{display:none}

/* product */
.prod{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:40px;padding-bottom:80px}
.prod h1{font-size:clamp(26px,3.6vw,36px);font-weight:800;margin:4px 0}
.brandtag{display:inline-block;background:var(--ink);color:#fff;font-weight:800;font-size:12px;padding:3px 9px;border-radius:4px;text-transform:uppercase;letter-spacing:.04em}
.bigprice{font-size:56px;font-weight:800;line-height:1;letter-spacing:-.02em}
.bigprice sup{font-size:26px;vertical-align:top;position:relative;top:6px}
.buy{display:flex;gap:10px;align-items:center;margin:14px 0}
.qty{background:var(--soft);border-radius:30px;padding:10px 16px;font-weight:600;width:68px;border:0}
.box{border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:14px}
.box h4{margin:0 0 6px;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.drow{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.drow:first-child{border-top:0;padding-top:0}
.drow b{display:flex;justify-content:space-between;gap:10px}
.fitline{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;padding:4px 0}
.section{margin-top:28px}
.section h2{font-size:22px;font-weight:800;margin:0 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spect{width:100%;border-collapse:collapse;font-size:14.5px}
.spect td{padding:9px 10px;border-bottom:1px solid var(--line)}
.spect tr:nth-child(odd){background:var(--soft2)}
.spect td:first-child{font-weight:600;width:40%}
details.ai summary{cursor:pointer;font-weight:700}
pre.json{font:12px/1.45 ui-monospace,Menlo,monospace;background:var(--soft);border-radius:8px;padding:12px;overflow-x:auto;margin:8px 0 0}

/* situations, labels, fixes, plain words */
.sitbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 18px}
.sit{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:700;text-align:left;background:var(--bg);line-height:1.25}
.sit:hover{border-color:var(--ink)}
.sit[aria-pressed="true"]{border-color:var(--purple);background:var(--purple-soft);color:var(--purple)}
.sit svg{width:26px;height:26px;flex:none}
.lbls{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}
.lbl{font-size:12px;font-weight:700;border-radius:4px;padding:2px 8px}
.lbl.ok{background:var(--ok-soft);color:var(--ok)}.lbl.warn{background:var(--warn-soft);color:var(--warn)}.lbl.fit{background:var(--purple-soft);color:var(--purple)}
.fixb{display:inline-block;margin-top:4px;border:1.5px solid var(--purple);color:var(--purple);border-radius:20px;padding:2px 10px;font-size:12.5px;font-weight:700;background:var(--bg)}
.fixb:hover{background:var(--purple-soft)}
.fixb.alt{border-color:var(--ink);color:var(--ink)}
.fixb.done{border-color:var(--ok);color:var(--ok);cursor:default}
.fitgroup{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:10px}
.plain{background:var(--purple-soft);border-radius:10px;padding:14px 16px;margin-top:12px}
.plain h3{margin:0 0 6px;font-size:16px}
.plain ul{margin:0 0 8px;padding-left:18px}
.plain li{margin:3px 0}
/* warranty and edit */
.wtags{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 8px}
.wt{font-size:11.5px;font-weight:700;border-radius:4px;padding:2px 7px}
.wt.green{background:var(--ok-soft);color:var(--ok)}.wt.yellow{background:var(--warn-soft);color:var(--warn)}.wt.grey{background:#ececec;color:#5f5f5f}.wt.blue{background:#e3eefc;color:#1d4ed8}.wt.plain{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.editform{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;margin:6px 0}
.editform label{display:flex;flex-direction:column;font-size:12px;font-weight:600;gap:3px;min-width:0}
.editform input,.editform select{border:1px solid var(--ink);border-radius:6px;padding:6px 8px;font-weight:400;min-width:0;background:var(--bg)}
.editform input:disabled,.editform select:disabled{background:var(--soft);color:var(--muted);border-color:var(--line)}
.editform .full{grid-column:1/-1}
.about{margin:18px 0 6px}
.about .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px 22px;margin-top:8px}
.pfl{font-size:12.5px;font-weight:700;margin-bottom:5px}
.about .chip{font-size:12.5px;padding:3px 10px}
.about input{border:1px solid var(--ink);border-radius:6px;padding:4px 8px;margin-top:6px;width:120px}
/* contact extras */
.ainote{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;margin:10px 0 0}
.helper{display:flex;align-items:center;gap:10px;margin-top:12px;font-weight:700}
.helper .av{width:34px;height:34px;font-size:11px;border-width:0;margin:0}
.wait{font-weight:400;color:var(--muted);font-size:13px;margin-left:2px}
.skip{font-size:13.5px;text-decoration:underline;color:var(--muted);margin-top:2px;padding:4px 2px}
.sumbox textarea{width:100%;min-height:170px;border:1px solid var(--ink);border-radius:8px;padding:10px;font:14px/1.5 var(--f);margin-top:8px}
.aboutprod{display:inline-flex;gap:8px;align-items:center;background:var(--soft);border-radius:8px;padding:6px 10px;font-size:13.5px;margin-top:12px}
/* chat extras */
.intent{display:block;width:100%;text-align:left;border:1.5px solid var(--purple);border-radius:10px;padding:10px 12px;font-weight:700;color:var(--purple);background:var(--bg)}
.intent:hover{background:var(--purple-soft)}
.intents{display:flex;flex-direction:column;gap:6px}
.savednote{font-size:12.5px;color:var(--ok);background:var(--ok-soft);border-radius:6px;padding:4px 8px}
.savednote button{text-decoration:underline;color:inherit}
@media (max-width:700px){.sitbar{grid-template-columns:1fr 1fr}.editform{grid-template-columns:1fr}}

/* my rig page */
.rigpage{padding-bottom:90px}
.righead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0 8px}
.stat{background:var(--soft);border-radius:10px;padding:14px 16px}
.stat b{display:block;font-size:30px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.stat.alert b{color:var(--warn)}
.riggrid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:32px;margin-top:20px}
.riggrid h2{font-size:22px;font-weight:800;margin:0 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chains{display:flex;flex-direction:column;gap:12px;margin-bottom:28px}
.chain{background:var(--soft2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.chain h3{margin:0 0 10px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.flow{display:flex;align-items:center;gap:6px;overflow-x:auto;padding-bottom:4px}
.node{flex:none;width:118px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px;text-align:center;font-size:12px;line-height:1.3}
.node .sil{aspect-ratio:3/2;margin-bottom:4px}
.node.missing{border-style:dashed;border-color:var(--purple);color:var(--purple);background:var(--purple-soft);display:grid;place-items:center;min-height:98px;font-weight:700;cursor:pointer}
.flow .arr{flex:none;color:var(--muted)}
.gearlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.gear{background:var(--soft);border-radius:10px;padding:12px;display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;align-items:start}
.gear h4{margin:0;font-size:15px;line-height:1.3}
.gear .meta{font-size:12.5px;color:var(--muted);margin:2px 0 6px}
.gear .acts{display:flex;gap:6px;flex-wrap:wrap}
.addgear{border:1.5px dashed var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;margin-top:12px}
.addgear .row2{display:flex;gap:8px;flex-wrap:wrap}
.addgear input,.addgear select{border:1px solid var(--ink);border-radius:8px;padding:8px 10px;min-width:0;flex:1 1 160px;background:var(--bg)}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.side .box h4{font-size:16px}
.health .fitline{border-top:1px solid var(--line);padding:8px 0}
.health .fitline:first-of-type{border-top:0}
@media (max-width:980px){.riggrid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1 / -1}}

/* contact */
.contact{display:grid;grid-template-columns:240px minmax(0,1fr);gap:40px;padding:24px 0 80px}
.side-nav{display:flex;flex-direction:column;gap:14px;font-weight:700;font-size:15px}
.side-nav .on{color:var(--purple)}
.stepcard{border:1px solid var(--line);border-radius:10px;padding:28px clamp(16px,4vw,48px);margin-top:20px}
.avatars{display:flex}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;border:3px solid #fff;margin-left:-8px;box-shadow:0 0 0 1px var(--line)}
.avatars .av:first-child{margin-left:0}
.prog{height:8px;background:var(--line);border-radius:4px;margin:18px 0 6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--purple);transition:width .3s}
.steplbl{color:var(--purple);font-weight:600;font-size:13px}
.answered{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px}
.answered h3,.q h3{margin:0;font-size:18px;font-weight:700}
.answered p{margin:2px 0 0;font-size:14px}
.edit{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;flex:none}
.q{margin-top:22px}
.q h3::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--purple);margin-right:10px;vertical-align:middle}
.opts{display:flex;flex-direction:column;align-items:flex-start;gap:10px;margin-top:12px}
.stepfoot{display:flex;justify-content:center;gap:16px;margin-top:28px;border-top:1px solid var(--line);padding-top:18px}
.stepfoot .ghost{font-weight:700;padding:10px 18px}
.stepfoot .dis{background:var(--soft);color:#aaa;border-radius:30px;padding:10px 22px;font-weight:700}
.note{background:var(--soft);border-radius:10px;padding:12px 14px;font-size:14px;margin-top:14px}
.aitag{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;background:var(--purple);color:#fff;border-radius:4px;padding:1px 6px}

/* need help pill + drawer */
.needhelp{position:fixed;right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:40px;box-shadow:0 4px 18px rgba(0,0,0,.16);padding:6px 6px 6px 18px;font-weight:600;font-size:14px}
.needhelp .av{width:34px;height:34px;font-size:11px;border-width:2px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--bg);z-index:51;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.wide{width:min(540px,100%)}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:22px 24px 6px}
.dhead h2{margin:0;font-size:20px;font-weight:800}
.dbody{flex:1;overflow:auto;padding:8px 24px 24px;display:flex;flex-direction:column;gap:14px}
.dfoot{border-top:1px solid var(--line);padding:12px 24px;display:flex;justify-content:center;gap:16px}

/* chat widget */

function scoreQ(p,q){
  if(!q)return 1;const words=q.toLowerCase().split(/\s+/).filter(w=>w.length>1&&!["for","the","a","and","with","my","to"].includes(w));
  const hay=(p.n+" "+p.b+" "+p.tags.join(" ")+" "+CATS[p.c]).toLowerCase();
  return words.reduce((a,w)=>a+(hay.includes(w)?1:hay.includes(w.replace(/s$/,""))?1:0),0);
}
function resultsList(){
  const v=S.view;
  let l=P.map(p=>({p,s:scoreQ(p,v.q)})).filter(o=>o.s>0).map(o=>o.p);
  if(v.sit)l=l.filter(p=>p.sit?.includes(v.sit));
  if(v.cats.length)l=l.filter(p=>v.cats.includes(p.c));
  if(v.min)l=l.filter(p=>p.p>=+v.min); if(v.max)l=l.filter(p=>p.p<=+v.max); if(v.stock)l=l.filter(p=>p.st>0);
  const sorts={rel:(a,b)=>P.indexOf(a)-P.indexOf(b),pop:(a,b)=>b.rv-a.rv,low:(a,b)=>a.p-b.p,high:(a,b)=>b.p-a.p,rated:(a,b)=>b.r-a.r};
  return l.sort(v.q?((a,b)=>scoreQ(b,v.q)-scoreQ(a,v.q)||sorts[v.sort](a,b)):sorts[v.sort]);
}
const SIT_ICON={
 home:'<svg class="i" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',

 recording:'<svg class="i" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/></svg>',
 child:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="6" r="3"/><path d="M12 9v6M7 12l5-2 5 2M9 21l3-6 3 6"/></svg>',
};
const NOT_PLAYABLE=["strings","cable","battery","picks","usbcable","booster","psu"];
function rowLabels(p){
  const miss=missingFor(p),fit=fitCheck([p.id]).filter(c=>c.type==="fit"||c.type==="computer"),out=[];
  if(!NOT_PLAYABLE.includes(p.cp.kind)){
    if(!miss.length)out.push(`<span class="lbl ok">Complete – ready to play</span>`);
    else out.push(`<span class="lbl warn">Needs extra parts: ${esc(miss.map(m=>m.what.replace(/^an? /,"").replace(/ \(.*\)$/,"").replace(/ with .*$/,"").replace(/ to chain.*$/,"")).join(" + "))}</span>`);
  }
  if(rigItems().length&&!fit.some(c=>c.status!=="ok"))out.push(`<span class="lbl fit">Fits your gear</span>`);
  return out.length?`<div class="lbls">${out.join("")}</div>`:"";
}
function resultsView(){

  return `<div class="wrap">
  <div class="crumbs"><span>⌂</span><span class="last">${v.q?`“${esc(v.q)}”`:esc(title)}</span></div>

  <div class="toolbar"><button class="pill filterbtn" id="fbtn" style="padding:6px 14px">Filter</button><span></span>
    <label class="muted">Sort <select id="sort" aria-label="Sort">${[["rel","Relevance"],["pop","Popularity"],["low","Price: low to high"],["high","Price: high to low"],["rated","Best rated first"]].map(([k,t])=>`<option value="${k}"${v.sort===k?" selected":""}>${t}</option>`).join("")}</select></label></div>
  <div class="sitbar" role="group" aria-label="What is it for?">${Object.entries(SITUATIONS).map(([k,t])=>`<button class="sit" data-sit="${k}" aria-pressed="${v.sit===k}">${SIT_ICON[k]}<span>${t}</span></button>`).join("")}</div>
  <div class="res">
   <aside class="filters" id="filters">
    <div class="blk"><h3>Categories</h3>${catCounts.map(([c,n])=>`<label><input type="checkbox" data-fc="${c}"${v.cats.includes(c)?" checked":""}>${CATS[c]} (${n})</label>`).join("")}</div>
    <div class="blk"><h3>Price range</h3><div class="range"><input id="fmin" inputmode="numeric" placeholder="From (€)" value="${esc(v.min)}" aria-label="Minimum price"><input id="fmax" inputmode="numeric" placeholder="To (€)" value="${esc(v.max)}" aria-label="Maximum price"></div></div>
    <div class="blk"><h3>Availability</h3><label><input type="checkbox" id="fstock"${v.stock?" checked":""}>In stock</label></div>
   </aside>
   <div class="list">
    ${v.q||v.sit?`<div class="askstrip"><span class="aiav sm">${AISVG}</span><p><b>Not sure which one fits?</b> The AI advisor can ask what you need, check it works with your gear and compare options.</p><button class="cta purple" style="padding:9px 18px" data-ask="${esc(v.q||SITUATIONS[v.sit]+": what do you recommend for me?")}">Ask the advisor</button></div>`:""}
    ${l.map(p=>`<article class="row" data-detail="${p.id}" tabindex="0">

      <div class="side">${p.rv>3000?'<span class="flag">Top seller</span>':"<span></span>"}<div style="text-align:right"><div class="big">${eur(p.p)}</div>${p.bs?`<div class="muted">B-Stock from ${eur(p.bs)}</div>`:""}</div>
       <div class="acts"><button aria-label="${isSaved(p.id)?"Remove from":"Add to"} Saved" data-save="${p.id}" data-kind="heart" aria-pressed="${isSaved(p.id)}" class="${isSaved(p.id)?"on":""}"><svg class="i" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></button><button aria-label="Add to basket" data-add="${p.id}"><svg class="i" viewBox="0 0 24 24"><path d="M3 4h2l2.4 11h11l2-8H6.2"/><circle cx="9" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></svg></button></div></div>
     </article>`).join("")||`<div class="note">No products match. Try fewer filters, or <button class="btn" data-ask="${esc(v.q||"Help me find the right gear")}">ask the advisor</button>.</div>`}
   </div></div></div>`;
}
function bindFilters(){
  const v=S.view;
  document.querySelectorAll("[data-fc]").forEach(cb=>cb.onchange=()=>{v.cats=cb.checked?[...v.cats,cb.dataset.fc]:v.cats.filter(c=>c!==cb.dataset.fc);render()});

const inBasket=id=>S.basket.some(b=>b.id===id);
function fixBtn(x){
  if(!x.fix||x.status==="ok")return "";
  const f=BY[x.fix];if(!f)return "";
  const short=f.n.replace(f.b+" ","").replace(/^the sssnake /,"").split(",")[0];

const FIT_GROUPS=[["ready","Ready to play?"],["fit","Works with your gear?"],["computer","Connects to your computer?"],["place","Right for where you play?"],["delivery","When will it arrive?"]];
function fitLinesHtml(fit){
  return FIT_GROUPS.map(([t,label])=>{const g=fit.filter(x=>x.type===t);if(!g.length)return "";
    return `<div class="fitgroup">${label}</div>`+g.map(x=>`<div class="fitline"><span class="badge ${x.status}">${x.status.toUpperCase()}</span><span style="flex:1">${esc(x.note)}${fixBtn(x)?"<br>"+fixBtn(x):""}</span></div>`).join("")}).join("");
}
/* "What this means for you": spec values turned into plain sentences, using About you */
function plainWords(p){
  const pr=S.profile,cp=p.cp,L=[],flat=pr.place==="flat";
  const sp=p.specs,watts=parseFloat(String(sp.Power||"").replace(",","."));
  if(cp.kind==="amp"){
    if(watts<=5)L.push("Quiet, bedroom-level amp: enough for practising, too quiet to play with a drummer.");
    else if(/tube/i.test(sp.Power))L.push(`${watts} W of tube power is loud: enough for rehearsals and small gigs${flat?", but too loud for a flat at a volume where it sounds good":""}.`);
    else L.push(`${watts} W: loud enough to play with a band${/0\.5/.test(sp.Power)?", and the 0.5 W setting keeps it quiet enough for a bedroom":""}.`);
    L.push(cp.headphoneOut?"Has a headphone output, so you can practise silently.":"No headphone output: you always play out loud.");
    if(cp.usbAudio)L.push("Records straight into your computer over USB, no audio interface needed.");
  } else if(cp.kind==="headphones"){
    L.push(cp.ohm>=250?`${cp.ohm} Ω means they need a strong headphone output: great on an audio interface, quiet on a phone or laptop.`:`${cp.ohm} Ω: loud enough on a phone, laptop or interface.`);
    L.push(/closed/i.test(sp.Type)?"Closed back: blocks outside noise and hardly leaks, good for recording and for flats.":"Open back: very natural sound for mixing, but people nearby hear it too.");
  } else if(cp.kind==="mic"){
    L.push(/condenser/i.test(sp.Type)?"Condenser mic: very detailed, but it also picks up your room, keyboard clicks and traffic.":"Dynamic mic: hears mostly what's right in front of it, so a noisy room matters less.");
    const itf=rigItems().find(x=>x.cp?.kind==="interface");
    if(itf)L.push(itf.cp.gain>=cp.gainNeed?`Works with your ${itf.name} without extra gear.`:`Needs more boost than your ${itf.name} gives; an inline booster like the FetHead fixes that.`);
    if(cp.needsPhantom)L.push("Needs 48 V phantom power, which almost every audio interface has.");
  } else if(cp.kind==="booster"){

const CUSTOM_KINDS={guitar:["Guitar","guitars","electric guitar"],amp:["Amp","amps","amp"],pedal:["Pedal","pedals","pedal"],interface:["Audio interface","interfaces","interface"],mic:["Microphone","mics","mic"],headphones:["Headphones","headphones","headphones"],keys:["Keyboard","keys","keys"],computer:["Computer","computer","computer"],other:["Other","other","other"]};
const parseDate=s=>{if(!s)return null;const t=String(s),d=new Date(t.length===4?t+"-01-01":t.length===7?t+"-01":t);return isNaN(d)?null:d};
const daysSince=s=>{const d=parseDate(s);return d?Math.round((TODAY-d)/864e5):null};
const isoDay=d=>d.toISOString().slice(0,10);
const addMonths=(d,m)=>{const t=new Date(d);t.setMonth(t.getMonth()+m);return t};
function ownedFor(since){
  const days=daysSince(since);if(days===null)return "";
  if(days<0)return `Arriving ${String(since).slice(0,10)}`;
  if(days<31)return `Owned ${Math.max(days,0)} day${days===1?"":"s"}`;
  const m=Math.floor(days/30.44),y=Math.floor(m/12),mm=m%12;
  return "Owned "+[y?`${y} y`:"",mm?`${mm} m`:""].filter(Boolean).join(" ");
}
function warrantyOf(r){
  const d=parseDate(r.since);
  if(r.bought==="thomann"&&d){const ret=new Date(d.getTime()+30*864e5);return {end:addMonths(d,36),src:"Thomann 3-year warranty",returnUntil:ret,returnDays:Math.ceil((ret-TODAY)/864e5)}}

}
function warrantyLeft(w){return w?Math.ceil((w.end-TODAY)/864e5):null}
function warrantyTags(r){

      out.push(`<span class="wt ${left<183?"yellow":"green"}" title="${esc(w.src)} until ${isoDay(w.end)}">Warranty · ${txt} left</span>`)}

 }});

/* API mode: when the page is served by the Gear Advisor server (not claude.ai), the server calls Claude
   with the operator's key. Same contract as claude.use("sample"): the page runs the tools, the server runs the model. */
function apiSample(input,opts={}){
  return (async()=>{
    const msgs=typeof input==="string"?[{role:"user",content:input}]:input.map(m=>({role:m.role,content:m.content}));
    const tools=(opts.tools||[]).map(t=>({name:t.name,description:t.description,input_schema:t.inputSchema||{type:"object",properties:{}}}));
    const byName=Object.fromEntries((opts.tools||[]).map(t=>[t.name,t]));
    let text="";
    for(let round=0;round<8;round++){
      let res;
      try{res=await fetch("api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:msgs,tools,tier:opts.modelTier}),signal:opts.signal})}
      catch(e){throw {code:opts.signal?.aborted?"cancelled":"upstream_error",text}}
      const data=await res.json().catch(()=>({}));
      if(!res.ok)throw {code:{rate_limited:"rate_limited",not_configured:"api_unavailable"}[data.error]||"upstream_error",message:data.message||"",text};
      if(data.stop_reason==="refusal")throw {code:"refused"};
      const add=data.content.filter(b=>b.type==="text").map(b=>b.text).join("");
      if(add.trim()){const delta=(text?"\n\n":"")+add;text+=delta;opts.onText?.({text,delta})}
      msgs.push({role:"assistant",content:data.content});
      const uses=data.content.filter(b=>b.type==="tool_use");
      if(data.stop_reason!=="tool_use"||!uses.length)return {text,truncated:data.stop_reason==="max_tokens"};
      const results=await Promise.all(uses.map(async u=>{
        try{
          const t=byName[u.name];if(!t)throw new Error("Unknown tool "+u.name);
          const out=await t.execute(u.input||{},{signal:opts.signal});
          const str=typeof out==="string"?out:JSON.stringify(out);
          return {type:"tool_result",tool_use_id:u.id,content:str.slice(0,32000)};
        }catch(e){return {type:"tool_result",tool_use_id:u.id,content:"Error: "+(e?.message||e),is_error:true}}
      }));
      if(opts.signal?.aborted)throw {code:"cancelled",text};
      msgs.push({role:"user",content:results});
    }
    return {text,truncated:true};
  })();
}

function md(src){
  const lines=esc(src).split("\n");let out="",list=null;
  const inl=s=>s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<i>$2</i>").replace(/`([^`]+)`/g,"<code>$1</code>");
  const close=()=>{if(list){out+=`</${list}>`;list=null}};
  for(const l of lines){let m;
    if((m=l.match(/^\s*[-*•]\s+(.*)/))){if(list!=="ul"){close();out+="<ul>";list="ul"}out+=`<li>${inl(m[1])}</li>`}
    else if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){if(list!=="ol"){close();out+="<ol>";list="ol"}out+=`<li>${inl(m[1])}</li>`}
    else if((m=l.match(/^#{1,4}\s+(.*)/))){close();out+=`<h4>${inl(m[1])}</h4>`}
    else if(!l.trim())close(); else{close();out+=`<p>${inl(l)}</p>`}}
  close();return out;
}

  if(c?.enquiry==="Order/Return")return "service";
  if(S.lastCat)return DEPT2EXP[DEPT(S.lastCat)];
  if(S.viewing&&BY[S.viewing])return DEPT2EXP[DEPT(BY[S.viewing].c)];
  return "recording";
}
function localSummary(){
  const asks=S.turns.filter(t=>t.role==="user").map(t=>t.content).slice(-3);
  return asks.length?`Customer asked: ${asks.map(a=>"“"+a.slice(0,140)+"”").join(" → ")}. Owns: ${rigItems().map(r=>r.name).slice(0,6).join(", ")}.`:`New conversation, no questions yet. Owns: ${rigItems().map(r=>r.name).slice(0,6).join(", ")}.`;
}
async function summarise(){
  if(!sample||!S.turns.length)return localSummary();
  try{const r=await sample(`Summarise this shop chat for a product specialist in 3 short sentences: goal, budget, owned gear, open questions. No preamble.\n\nMy rig: ${rigItems().map(r=>r.name).join(", ")}\n\n`+S.turns.map(t=>t.role+": "+t.content.replace(/\n\[cards shown.*$/s,"")).join("\n").slice(-6000),{modelTier:"quick",cache:false});return r.text.trim()}catch(e){return localSummary()}
}
async function handover(dept,summary){
  if(S.busy&&S.ctl)S.ctl.abort();
  const k=dept&&EXPERTS[dept]?dept:pickExpert(),e=EXPERTS[k];
  if(!S.online){
    const m=botMsg(`<p>Our specialists are offline right now and back at <b>9:00</b>. I can keep helping, or arrange for <b>${esc(e.name)}</b> to get back to you.</p>`);
    m.querySelector(".cards").innerHTML=`<div class="card"><h5>${esc(e.name)} · ${esc(e.role)} <span class="tag sim">simulated</span></h5><div class="prow"><button class="btn primary" data-cb="call">Request a call back</button><button class="btn" data-cb="message">Leave a message</button><button class="btn" data-say="Let's keep going with you for now.">Keep chatting with the AI</button></div><div class="muted" data-cbs></div></div>`;
    return;
  }
  sysLine("Connecting you to a specialist…");
  const sum=summary||await summarise();
  setTimeout(()=>{
    S.mode="human";S.expert=k;renderWho();
    sysLine(`${e.name} joined the chat · has read your conversation`);
    const m=botMsg(`<p>Hi, I'm ${esc(e.name.split(" ")[0])}, ${esc(e.role.toLowerCase())}. I've read your chat with the advisor, so no need to repeat anything. Let me take it from here.</p>`,k);
    m.querySelector(".cards").innerHTML=`<div class="card"><h5>What ${esc(e.name.split(" ")[0])} sees <span class="tag edge">expert handoff</span></h5><div>${esc(sum)}</div></div>
      <div class="endnote"><b>Simulated hand-over.</b> In the live shop ${esc(e.name)} would now chat with you in person. <div class="prow"><button class="btn primary" data-backai>Back to the AI advisor</button></div></div>`;
    composer(false,`You're with ${esc(e.name)} (simulated). <button class="btn" data-backai>Back to the AI advisor</button>`);
    scrollLog();
  },1100);
}
function backToAi(){S.mode="ai";renderWho();composer(true);sysLine("You're back with the AI advisor");}

   <div class="muted">${esc(e.role)} · ${esc(e.since)}</div><div style="margin:6px 0;padding:8px;background:var(--soft);border-radius:8px"><b>Summary they'll get</b><br>${esc(i.summary)}</div>
   <div class="prow">${S.online?`<button class="btn primary" data-handover="${k}" data-sid="${sid}">Bring ${esc(e.name.split(" ")[0])} into this chat</button>`:`<button class="btn primary" data-cb="call">Request a call back</button><button class="btn" data-cb="message">Leave a message</button>`}</div><div class="muted" data-cbs></div></div>`);
  shownLog.push("handoff("+k+")");

function rulesText(){
  return `You are Thomann's AI advisor inside the shop's Live chat (a concept prototype of the Thomann music shop). All catalogue, stock, order, return-reason and rig data is demo data supplied by this page.

HOW TO WORK
- Product facts (prices, specs, stock, return reasons, compatibility) come ONLY from the catalogue below and your tools. Never invent products, prices or specs. If something isn't in the catalogue, say so and offer the closest item.
- This is a chat widget about 380px wide: keep answers short (2-5 sentences or a short list). When you recommend specific items, show them with show_products (or compare_products / build_rig / price_check, which show their own cards). Don't repeat card contents.
- NEEDS INTERVIEW: the customer came through Live chat to get advice. If a buying request lacks key facts (instrument, level, style or genre, budget, what they already own), ask before recommending: call offer_choices with ONE question, then end your turn with at most one short sentence. Max 2 rounds. Skip what My rig, the entry context or the message already answers.
- SOUND MATCH: translate a described sound, artist or song into gear traits (pickups, amp, effects), search by tags, explain the link briefly.
- RIG BUILDER: pick items via search_products, then call build_rig with the budget. Leave room for cables.
- GEAR FIT: before recommending anything that connects to their gear, call check_fit. Report problems plainly and name the fix.
- TRANSPARENCY: mention notable return reasons when relevant (return_insights). Point out cheaper options and B-Stock (price_check), including house brands like Harley Benton and the sssnake. Never pressure.
- ADVISE, NEVER BUY: you cannot order or add to the basket; the customer uses the buttons on the cards.
- ORDERS & RETURNS: 30-day money-back guarantee and 3-year warranty. Before a fault return, offer setup_help first; use orders(start_return) only if they still want to return.
- ABOUT YOU: the customer's About you profile is in the page context; use it (level, where they play, computer, who it's for). Whenever they tell you any of these, call update_profile straight away with just those fields.
- NEVER ASSUME A LEVEL: don't assume the customer is a beginner (or a pro). Use the level in About you. If it isn't filled in and it matters, ask it as one offer_choices question ("How long have you been playing?": Just starting / A few years / Gigging or pro) and save it with update_profile. If About you has a level, confirm it in passing rather than asking again, e.g. "As an intermediate player, ..."; the customer can correct it.
- STARTER BUTTONS: "I want to buy an instrument" -> interview with offer_choices, ONE question per turn, max 4, skipping anything About you or My rig already answers, in this order: which instrument (Guitar, Bass, Drums, Keys, Mic/recording, Other); level (confirm from About you, or ask as above); budget; where they'll play. Save answers with update_profile. Then recommend 2-3 options with show_products, a short reason for each in notes, matched to their level (complete ready-to-play packages only for people just starting). "I want to upgrade my rig" -> look at My rig and About you and suggest the one change with the biggest effect. "Something isn't working" -> ask which item and what happens (offer_choices with their My rig items), then setup_help. "A question about an order" -> call orders(list) and ask which order.
- SAVED PRODUCTS: the customer saves products themselves with the Save buttons on your cards, product pages and search results. Never save anything on your own initiative, and don't push them to save. Only call save_to_picks when they explicitly ask you in words to save specific products. Their Saved list is in the page context; when they mention "my saved ones" or "the ones I saved", use it. Always pass a short reason per product in show_products notes; it is kept if they save the product.
- WARRANTY: items bought at Thomann have a 3-year Thomann warranty from delivery (dates are in My rig); items bought elsewhere only have the warranty date the customer entered, if any. For a fault under warranty, offer setup_help first; if it's still broken, call expert_handoff with department "service".
- WHEN YOU DON'T KNOW: if the catalogue, your tools and solid general knowledge can't answer (vintage or unlisted gear, compatibility you can't verify, repairs, anything you'd be guessing), say plainly "I'm not sure about that", give the reason in one short sentence, and call expert_handoff. Never guess specs or compatibility.
- HUMAN SPECIALISTS: real Thomann specialists stand behind this chat. The customer can press "Talk to a person" at the top of the chat at any time. After you give a recommendation, you may add one short line offering a specialist. For complex or professional setups, budgets over €2,000, installations, repairs, or when they ask for a person, call expert_handoff with a summary the specialist can act on. Specialists are currently ${S.online?"ONLINE and can join this chat now":"OFFLINE until 9:00; offer a call back"}.
- MY RIG: the customer's owned gear is listed in the context. Use it for upgrades, refills (strings older than about 3 months) and compatibility. If they mention owning or selling gear, call update_rig.
- Music theory, technique and general gear knowledge: answer from your own knowledge, briefly.
- Reply in the customer's language. Prices in EUR. Light Markdown only (bold, short lists); no tables.

CATALOGUE (id | name | category | price | tags)
${P.map(p=>`${p.id} | ${p.n} | ${p.c} | €${p.p}${p.bs?" (B-Stock €"+p.bs+")":""} | ${p.tags.join(", ")}`).join("\n")}`;
}
function contextText(){
  const v=S.viewing&&BY[S.viewing],c=S.chatCtx;
  return `[Page context, today ${TODAY.toISOString().slice(0,10)}${c?.enquiry?`; entered Live chat via contact form: ${[c.enquiry,c.category,c.need].filter(x=>x&&x!=="skipped").join(" → ")}${c.product?` about ${BY[c.product].n} (${c.product})`:""}`:""}${v?`; customer is viewing: ${v.n} (${v.id})`:""}${S.view.q?`; last search: "${S.view.q}"`:""}; specialists ${S.online?"online now":"offline until 9:00"}
About you: ${Object.entries(PROFILE_FIELDS).map(([k,f])=>{const v=S.profile[k];return v&&(!Array.isArray(v)||v.length)?`${f.label}: ${f.multi?v.map(x=>f.opts[x]).join(", "):f.opts[v]}`:null}).filter(Boolean).join("; ")||"not filled in"}${S.profile.forWhom==="child"&&S.profile.childAge?`; child's age: ${S.profile.childAge}`:""}
My rig: ${rigItems().map(r=>{const w=warrantyOf(r);return `${r.name}${r.id?" ("+r.id+")":""} – ${r.bought==="thomann"?`bought at Thomann ${String(r.since).slice(0,10)}${r.order?" ("+r.order+")":""}`:`bought elsewhere, owned since ${r.since||"?"}`}${w?`, warranty until ${isoDay(w.end)}${warrantyLeft(w)<=0?" (ended)":""}`:", no warranty date"}${w?.returnDays>0?`, 30-day return open for ${w.returnDays} more days`:""}${r.note?" – "+r.note:""}`}).join("; ")||"empty"}
Basket: ${S.basket.map(x=>`${x.qty}× ${BY[x.id].n}`).join("; ")||"empty"}
Saved products (saved by the customer, newest first): ${S.picks.slice(0,20).map(x=>`${x.star?"★ ":""}${BY[x.id].n} (${x.id})${x.why?" – "+x.why:""}`).join("; ")||"none yet"}
Orders: ${ORDERS.map(o=>`${o.id} ${o.status} (${o.items.map(([id])=>BY[id].n).join(", ")})`).join("; ")}]`;
}
const ERR={api_unavailable:"The AI advisor isn't set up on this server yet. Tap Talk to a person instead.",not_granted:"You didn't allow this page to use your Claude account, so the AI advisor can't answer. Reload the page to be asked again, or tap Talk to a person.",sampling_disabled:"Claude isn't available for this account.",rate_limited:"You've reached your Claude usage limit for now, or sent many messages quickly. Wait a little and try again, or tap Talk to a person.",session_expired:"You're signed out of Claude. Sign in at claude.ai, then reload this page.",refused:"I can't help with that one. Try rephrasing, or tap Specialist.",empty_completion:"No answer came back. Try asking differently.",prompt_too_large:"This chat got too long. Start a new conversation from the Test guide.",tools_unavailable:"This viewer can't run the shop tools. Try the latest Claude app or claude.ai."};
async function send(text){
  text=String(text||"").trim();if(!text||S.busy)return;
  if(!S.started)startConversation();else setChat("open");
  if(S.mode==="human")backToAi();
  userMsg(text);
  if(text.length>=18||!S.topic)S.topic=text.length>90?text.slice(0,88)+"…":text;
  if(!sample){botMsg(`<p>${sampleState==="loading"?"I'm still connecting. Try again in a moment.":noAI()}</p>`);return}
  const m=botMsg(""),body=m.querySelector(".body"),cards=m.querySelector(".cards");
  const tb=document.createElement("div");tb.className="b";tb.innerHTML=`<span class="typing"><i></i><i></i><i></i></span>`;body.insertBefore(tb,cards);
  const st=document.createElement("div");st.className="status";body.insertBefore(st,cards.nextSibling);
  currentCards=cards;setStatus=t=>{st.textContent=t};shownLog.length=0;
  S.busy=true;$("#sendb").hidden=true;$("#stopb").hidden=false;
  const ctl=new AbortController();S.ctl=ctl;
  const ask={role:"user",content:contextText()+"\n\nCustomer: "+text};
  const input=S.apiMode?[...S.turns.slice(-16),ask]:[{role:"user",content:rulesText()},...S.turns.slice(-16),ask];
  let fin="";
  try{
    const r=await sample(input,{cache:false,signal:ctl.signal,modelTier:S.tier,tools:toolList,onText:({text:t})=>{fin=t;tb.innerHTML=md(t);st.textContent="";scrollLog()}});
    fin=r.text;if(r.text.trim())tb.innerHTML=md(r.text);else tb.remove();if(r.truncated)tb.insertAdjacentHTML("beforeend",`<p class="muted">Cut short. Ask for less at a time.</p>`);
  }catch(e){
    fin=e?.text||"";
    if(e?.code==="refused"){tb.innerHTML=`<p>${ERR.refused}</p>`;fin=""}
    else if(e?.code==="cancelled"){if(fin)tb.innerHTML=md(fin)+`<p class="muted">Stopped.</p>`;else tb.remove()}
    else tb.innerHTML=(fin?md(fin):"")+`<p class="muted">${esc(ERR[e?.code]||"Something went wrong reaching the advisor. Try again.")}</p>`;
    if(["not_granted","sampling_disabled","tools_unavailable","session_expired","api_unavailable"].includes(e?.code)){sample=null;sampleState="none";updateAcct()}
  }finally{st.remove();currentCards=null;S.busy=false;S.ctl=null;$("#sendb").hidden=false;$("#stopb").hidden=true;sendState()}
  const lastIds=shownLog.join(",").match(/[a-z]{1,2}\d+/g)?.filter(id=>BY[id]&&BY[id].c!=="accessories");if(lastIds?.length)S.lastCat=BY[lastIds[0]].c;
  if(["rig","product","picks"].includes(S.view.name))render();
  S.turns.push({role:"user",content:text});
  S.turns.push({role:"assistant",content:(fin||"(no text)")+(shownLog.length?`\n[cards shown: ${shownLog.join("; ")}]`:"")});
  scrollLog();
}

const sq=$("#sq"),ac=$("#ac");
function renderAc(){
  const q=sq.value.trim();if(!q){ac.hidden=true;return}
  const prods=P.map(p=>({p,s:scoreQ(p,q)})).filter(o=>o.s>0).sort((a,b)=>b.s-a.s||b.p.rv-a.p.rv).slice(0,3).map(o=>o.p);
  const cats=Object.entries(CATS).filter(([k,v])=>q.toLowerCase().split(/\s+/).some(w=>w.length>2&&(v.toLowerCase().includes(w)||P.some(p=>p.c===k&&p.tags.join(" ").includes(w))))).slice(0,3);
  ac.innerHTML=`<button class="askrow" data-ask="${esc(q)}"><span class="aiav sm">${AISVG}</span><span>Ask the advisor: <b>“${esc(q)}”</b></span></button>
   ${prods.length?`<div class="grp">Products</div>${prods.map(p=>`<button data-detail="${p.id}">${esc(p.n)}</button>`).join("")}`:""}
   ${cats.length?`<div class="grp">Categories</div>${cats.map(([k,v])=>`<button data-cat="${k}">${esc(v)}</button>`).join("")}`:""}`;
  ac.hidden=false;
}
sq.addEventListener("input",renderAc);sq.addEventListener("focus",renderAc);
$("#sform").addEventListener("submit",e=>{e.preventDefault();ac.hidden=true;sq.blur();go({name:"results",q:sq.value.trim()})});

/* ---------------- Global click handling ---------------- */
document.addEventListener("click",e=>{
  const t=e.target;
  if(!t.closest(".searchbox"))ac.hidden=true;
  ["shop","svc","acc"].forEach(k=>{if(!t.closest("#"+k+"Btn"))$("#"+k+"DD").hidden=true});
  if(!t.closest("#plus,#plusmenu"))$("#plusmenu").hidden=true;
  const a=t.closest("[data-go],[data-detail],[data-cat],[data-add],[data-addq],[data-ask],[data-say],[data-open],[data-rig-add],[data-toast],[data-close],[data-step],[data-step-edit],[data-step-reset],[data-method],[data-handover],[data-backai],[data-cb],[data-platform],[data-spec],[data-prefill],[data-sit],[data-expert],[data-send-contact],[data-ctab],[data-pick-star],[data-pick-rm],[data-pick-fit],[data-pick-cmp],[data-pick-cmpclose],[data-pick-clearsel],[data-picks-clear],[data-save],[data-save-all]");
  if(!a)return;
  if(a.matches("a"))e.preventDefault();
  const d=a.dataset;
  if(d.close!==undefined&&!d.detail)closeDrawer();
  if(d.go){closeDrawer();go({name:d.go});if(d.go==="results")sq.value=""}
  else if(d.detail){if(a.closest(".drawer"))closeDrawer();ac.hidden=true;go({name:"product",id:d.detail})}
  else if(d.cat){ac.hidden=true;sq.value="";go({name:"results",cats:[d.cat]})}
  else if(d.add)addBasket(d.add);
  else if(d.addq)addBasket(d.addq,Math.max(1,+($("#qty")?.value||1)));
  else if(d.ask||d.say){if(a.closest(".drawer"))closeDrawer();ac.hidden=true;$("#plusmenu").hidden=true;
    if(a.closest(".choices")){if(S.busy)return}
    send(d.ask||d.say)}
  else if(d.open){closeDrawer();if(d.open==="rig")go({name:"rig"});else if(d.open==="picks")go({name:"picks"});else if(d.open==="about"){go({name:"rig"});setTimeout(()=>$("#about")?.scrollIntoView({behavior:"smooth",block:"start"}),30)}else ({orders:openOrders,basket:openBasket})[d.open]()}
  else if(d.rigAdd)addRig(d.rigAdd);
  else if(d.toast)toast(d.toast);
  else if(d.step){const c=ctxOf(d.where);c[d.step]=d.v||null;c.summary=null;refreshSteps(d.where)}
  else if(d.stepEdit){const c=ctxOf(d.where);for(const k of STEP_ORDER.slice(STEP_ORDER.indexOf(d.stepEdit)))c[k]=null;if(d.stepEdit==="enquiry")c.category=null;c.summary=null;c.sent=false;refreshSteps(d.where)}
  else if(d.stepReset!==undefined){if(d.where==="drawer"){closeDrawer()}else{S.contact={enquiry:null,category:null,need:null,method:null,product:null};render()}}
  else if(d.method){const c=ctxOf(d.where);
    if(d.method==="chat"){const ctx={enquiry:c.enquiry,category:c.category,need:c.need,product:c.product};closeDrawer();if(S.started)resetChat();openChat(ctx)}
    else{c.method=d.method;c.summary=null;c.sent=false;refreshSteps(d.where)}}
  else if(d.sendContact!==undefined){const c=ctxOf(d.where);c.summary=$("#sum-"+d.where).value;c.sent=true;refreshSteps(d.where);toast("Sent to your adviser (simulated)")}
  else if(d.sit){S.view.sit=S.view.sit===d.sit?"":d.sit;render()}
  else if(d.expert){const p=BY[d.expert];S.contact={enquiry:"Product advice",category:DEPT(p.c),need:null,method:null,product:p.id};go({name:"contact"})}
  else if(d.handover){handover(d.handover,window.__sums?.[d.sid]);a.disabled=true}
  else if(d.backai!==undefined)backToAi();
  else if(d.cb){const box=a.closest(".card").querySelector("[data-cbs]");box.textContent=d.cb==="call"?"Call back requested (simulated). A specialist will call you after 9:00 with this chat's summary.":"Message saved (simulated). A specialist will reply by email after 9:00.";a.parentElement.querySelectorAll("button").forEach(b=>b.disabled=true)}
  else if(d.platform!==undefined){closeDrawer();openChat();$("#chatw").classList.add("expanded")}
  else if(d.prefill){if(!S.started)startConversation();else setChat("open");cin.value=d.prefill;sendState();setTimeout(()=>{cin.focus();cin.setSelectionRange(cin.value.length,cin.value.length)},60)}
  else if(d.spec!==undefined){$("#plusmenu").hidden=true;handover()}
  else if(d.save){isSaved(d.save)?unsavePick(d.save):savePick(d.save)}
  else if(d.saveAll){const l=JSON.parse(d.saveAll);let n=0;for(const id of l)if(savePick(id,true))n++;toast(n?`Saved ${n} item${n>1?"s":""} from this setup`:"This setup is already saved");a.textContent="★ Setup saved";a.setAttribute("aria-pressed","true")}
  else if(d.ctab)setCtab(d.ctab);
  else if(d.pickStar){const pk=S.picks.find(x=>x.id===d.pickStar);if(pk){pk.star=!pk.star;savePicks();if(S.ctab==="picks")renderPicksPanel();if(S.view.name==="picks")render()}}
  else if(d.pickRm)unsavePick(d.pickRm);
  else if(d.pickFit){S.pickFit=S.pickFit===d.pickFit?null:d.pickFit;render()}
  else if(d.pickCmp!==undefined){if(S.pickSel.length>=2){S.pickCmp=[...S.pickSel];render();setTimeout(()=>$(".cmpbox")?.scrollIntoView({behavior:"smooth",block:"start"}),30)}}
  else if(d.pickCmpclose!==undefined){S.pickCmp=null;render()}
  else if(d.pickClearsel!==undefined){S.pickSel=[];render()}
  else if(d.picksClear!==undefined){if(confirm("Remove all "+S.picks.length+" saved products?")){const was=S.picks.map(x=>x.id);S.picks=[];S.pickSel=[];S.pickCmp=null;savePicks();was.forEach(syncSave);render();renderPicksPanel();toast("Saved list cleared")}}
});
