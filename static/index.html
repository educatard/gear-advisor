<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Thomann Gear Advisor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap">
<style>
/* Layout: a shop in Thomann's visual language (black bar, white nav with pill search, results list, product page),
   with the purple Live-chat widget docked bottom right. Single light theme by choice, matching the shop. */
:root{
  --ink:#1f1f1f; --bg:#ffffff; --soft:#f3f3f3; --soft2:#f7f7f8; --line:#e8e8e8; --muted:#686868;
  --black:#000000; --purple:#7e00f3; --purple-2:#a24bff; --purple-soft:#f2e6fe; --purple-light:#c9a3f7;
  --bubble:#e0e3ea; --ok:#1d8a3a; --warn:#a85f00; --bad:#c62828; --ok-soft:#e3f4e8; --warn-soft:#fdf0dc; --bad-soft:#fde4e4;
  --teal:#00a19a; --sil:#d4d4d8; --sil2:#bdbdc4;
  --f:"Open Sans",Verdana,Tahoma,Arial,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* top bars */
.promo{background:var(--purple-soft);text-align:center;font-size:13px;padding-block:7px}
.promo b{color:var(--purple)}
.topbar{background:var(--black);color:#fff}
.topbar .wrap{display:flex;align-items:center;gap:16px;height:44px}
.wm{font-weight:800;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:6px;white-space:nowrap}
.wm small{font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.7}
.wm-real{display:none}
body[data-brand="lookalike"] .wm-real{display:inline-flex;align-items:center}
body[data-brand="lookalike"] .wm-neutral{display:none}
.wm-real .dot{width:9px;height:9px;border-radius:50%;background:var(--teal);display:inline-block;margin:0 1px;transform:translateY(2px)}
.topbar .tusp{flex:1;text-align:center;font-weight:700;font-size:13px}
.topbar .links{display:flex;gap:18px;font-size:13px;font-weight:600}
.nav2{border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.nav2 .wrap{display:flex;align-items:center;gap:20px;height:62px}
.menu-btn{font-weight:700;font-size:16px;display:flex;align-items:center;gap:4px;position:relative}
.searchbox{flex:1;max-width:420px;margin:0 auto;position:relative}
.searchbox form{display:flex;align-items:center;border:1.5px solid var(--ink);border-radius:30px;padding:0 14px;height:42px;background:var(--bg)}
.searchbox form:focus-within{border-color:var(--purple);box-shadow:0 0 0 1px var(--purple)}
.searchbox input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:14.5px}
.ac{position:absolute;left:-10px;right:-10px;top:48px;background:var(--bg);border-radius:0 0 10px 10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:10px 0 12px;border-bottom:3px solid var(--purple);z-index:30}
.ac .grp{font-weight:700;font-size:14px;padding:8px 20px 2px;text-decoration:underline;text-decoration-color:var(--teal);text-decoration-thickness:3px;text-underline-offset:5px}
.ac button{display:block;width:100%;text-align:left;padding:6px 20px;font-size:14.5px}
.ac button:hover,.ac button.sel{background:var(--soft)}
.ac .askrow{display:flex;gap:10px;align-items:center;margin:0 10px 6px;width:auto;border-radius:10px;background:var(--purple-soft);padding:10px 12px}
.ac .askrow b{color:var(--purple)}
.icons{display:flex;gap:22px;align-items:center}
.iconbtn{position:relative;display:inline-flex}
.badge-n{position:absolute;top:-6px;right:-9px;background:var(--purple);color:#fff;font-size:10.5px;font-weight:700;border-radius:9px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
.dd{position:absolute;top:44px;background:var(--bg);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:8px 0;min-width:220px;z-index:40}
.dd button{display:flex;gap:10px;align-items:center;width:100%;padding:9px 16px;text-align:left;font-size:14.5px}
.dd button:hover{background:var(--soft)}

/* generic */
.pill{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--ink);border-radius:40px;padding:9px 18px;font-weight:700;font-size:15px;background:var(--bg)}
.pill:hover{background:var(--soft)}
.pill.purple{border-color:var(--purple);color:var(--purple)}
.pill.purple:hover{background:var(--purple-soft)}
.cta{background:var(--black);color:#fff;border-radius:50px;font-weight:700;padding:12px 28px;font-size:15px;text-transform:uppercase}
.cta:hover{background:#333}
.cta.purple{background:var(--purple);text-transform:none}
.cta.purple:hover{background:#6a00cc}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;font-size:12.5px;margin:16px 0 10px}
.crumbs span{background:var(--soft);padding:3px 10px;clip-path:polygon(0 0,calc(100% - 7px) 0,100% 50%,calc(100% - 7px) 100%,0 100%,7px 50%)}
.crumbs span:first-child{clip-path:polygon(0 0,calc(100% - 7px) 0,100% 50%,calc(100% - 7px) 100%,0 100%);border-radius:4px 0 0 4px}
.crumbs span.last{background:none}
.stars{letter-spacing:1px;font-size:14px;white-space:nowrap}
.st5{background:linear-gradient(90deg,var(--ink) var(--r),#c8c8c8 var(--r));-webkit-background-clip:text;background-clip:text;color:transparent}
.stars em{font-style:normal;color:var(--purple);font-size:13px;letter-spacing:0;margin-left:4px;text-decoration:underline}
.instock{color:var(--ok);font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.instock::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.instock.low{color:var(--warn)}.instock.out{color:var(--bad)}
.muted{color:var(--muted);font-size:13px}
.sil{background:var(--soft2);border-radius:8px;display:grid;place-items:center;aspect-ratio:4/3;max-width:100%}
.sil svg{width:70%;height:auto}

/* results */
h1.page{font-size:clamp(28px,4vw,40px);font-weight:800;margin:6px 0 4px;line-height:1.1;text-wrap:balance;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1.page .cnt{font-size:20px;color:var(--muted);font-weight:700}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0 16px;flex-wrap:wrap}
.toolbar select{border:0;font-weight:600;background:none}
.res{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;padding-bottom:80px}
.filters h3{font-size:15px;margin:0 0 8px}
.filters label{display:flex;gap:10px;align-items:center;font-size:14px;padding:3px 0;cursor:pointer}
.filters input[type=checkbox]{width:18px;height:18px;accent-color:var(--purple)}
.filters .blk{margin-bottom:22px}
.filters .range{display:flex;gap:8px}
.filters .range input{width:100%;min-width:0;border:1px solid var(--ink);border-radius:8px;padding:6px 8px}
.list{display:flex;flex-direction:column;gap:12px;min-width:0}
.row{background:var(--soft);border-radius:10px;padding:14px;display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:18px;cursor:pointer}
.row:hover{box-shadow:0 0 0 1.5px var(--line) inset;background:#eeeeef}
.row .sil{aspect-ratio:4/3}
.row h2{font-size:16px;margin:0 0 2px;font-weight:400}
.row h2 b{font-weight:700}
.row ul{margin:6px 0;padding-left:18px;font-size:13.5px}
.row ul li{list-style:circle}
.row .side{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:8px}
.row .big{font-size:22px;font-weight:800;white-space:nowrap}
.row .acts{display:flex;gap:12px}
.flag{background:var(--purple);color:#fff;font-size:11px;font-weight:800;padding:2px 7px;border-radius:3px;text-transform:uppercase}
.aisum{border:1.5px solid var(--purple);background:linear-gradient(180deg,var(--purple-soft),var(--bg) 70%);border-radius:12px;padding:12px 16px;margin:6px 0 14px;font-size:14.5px;max-width:900px}
.aisum-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.aisum-h b{color:var(--purple)}
.sumst{font-size:12.5px;color:var(--purple);animation:sumpulse 1.2s ease-in-out infinite}
@keyframes sumpulse{50%{opacity:.4}}
@media (prefers-reduced-motion:reduce){.sumst{animation:none}}
.sumhide{margin-left:auto;font-size:12.5px;color:var(--muted);text-decoration:underline}
.aisum-b{margin-top:6px;line-height:1.5}
.aisum-b p{margin:0 0 4px}.aisum-b ul{margin:4px 0;padding-left:20px}.aisum-b li{margin:2px 0}
.aisum-f{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:12px}
.sumshow{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:700;color:var(--purple);margin:4px 0 10px}
.askstrip{border:1.5px dashed var(--purple);background:var(--purple-soft);border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.askstrip p{margin:0;flex:1;min-width:200px;font-size:14px}
.filterbtn{display:none}

/* product */
.prod{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:40px;padding-bottom:80px}
.prod h1{font-size:clamp(26px,3.6vw,36px);font-weight:800;margin:4px 0}
.brandtag{display:inline-block;background:var(--ink);color:#fff;font-weight:800;font-size:12px;padding:3px 9px;border-radius:4px;text-transform:uppercase;letter-spacing:.04em}
.bigprice{font-size:56px;font-weight:800;line-height:1;letter-spacing:-.02em}
.bigprice sup{font-size:26px;vertical-align:top;position:relative;top:6px}
.buy{display:flex;gap:10px;align-items:center;margin:14px 0}
.qty{background:var(--soft);border-radius:30px;padding:10px 16px;font-weight:600;width:68px;border:0}
.box{border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:14px}
.box h4{margin:0 0 6px;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.drow{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.drow:first-child{border-top:0;padding-top:0}
.drow b{display:flex;justify-content:space-between;gap:10px}
.fitline{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;padding:4px 0}
.section{margin-top:28px}
.section h2{font-size:22px;font-weight:800;margin:0 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spect{width:100%;border-collapse:collapse;font-size:14.5px}
.spect td{padding:9px 10px;border-bottom:1px solid var(--line)}
.spect tr:nth-child(odd){background:var(--soft2)}
.spect td:first-child{font-weight:600;width:40%}
details.ai summary{cursor:pointer;font-weight:700}
pre.json{font:12px/1.45 ui-monospace,Menlo,monospace;background:var(--soft);border-radius:8px;padding:12px;overflow-x:auto;margin:8px 0 0}

/* situations, labels, fixes, plain words */
.sitbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 18px}
.sit{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:700;text-align:left;background:var(--bg);line-height:1.25}
.sit:hover{border-color:var(--ink)}
.sit[aria-pressed="true"]{border-color:var(--purple);background:var(--purple-soft);color:var(--purple)}
.sit svg{width:26px;height:26px;flex:none}
.lbls{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}
.lbl{font-size:12px;font-weight:700;border-radius:4px;padding:2px 8px}
.lbl.ok{background:var(--ok-soft);color:var(--ok)}.lbl.warn{background:var(--warn-soft);color:var(--warn)}.lbl.fit{background:var(--purple-soft);color:var(--purple)}
.fixb{display:inline-block;margin-top:4px;border:1.5px solid var(--purple);color:var(--purple);border-radius:20px;padding:2px 10px;font-size:12.5px;font-weight:700;background:var(--bg)}
.fixb:hover{background:var(--purple-soft)}
.fixb.alt{border-color:var(--ink);color:var(--ink)}
.fixb.done{border-color:var(--ok);color:var(--ok);cursor:default}
.fitgroup{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:10px}
.plain{background:var(--purple-soft);border-radius:10px;padding:14px 16px;margin-top:12px}
.plain h3{margin:0 0 6px;font-size:16px}
.plain ul{margin:0 0 8px;padding-left:18px}
.plain li{margin:3px 0}
/* warranty and edit */
.wtags{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 8px}
.wt{font-size:11.5px;font-weight:700;border-radius:4px;padding:2px 7px}
.wt.green{background:var(--ok-soft);color:var(--ok)}.wt.yellow{background:var(--warn-soft);color:var(--warn)}.wt.grey{background:#ececec;color:#5f5f5f}.wt.blue{background:#e3eefc;color:#1d4ed8}.wt.plain{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.editform{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;margin:6px 0}
.editform label{display:flex;flex-direction:column;font-size:12px;font-weight:600;gap:3px;min-width:0}
.editform input,.editform select{border:1px solid var(--ink);border-radius:6px;padding:6px 8px;font-weight:400;min-width:0;background:var(--bg)}
.editform input:disabled,.editform select:disabled{background:var(--soft);color:var(--muted);border-color:var(--line)}
.editform .full{grid-column:1/-1}
.about{margin:18px 0 6px}
.about .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px 22px;margin-top:8px}
.pfl{font-size:12.5px;font-weight:700;margin-bottom:5px}
.about .chip{font-size:12.5px;padding:3px 10px}
.about input{border:1px solid var(--ink);border-radius:6px;padding:4px 8px;margin-top:6px;width:120px}
/* contact extras */
.ainote{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;margin:10px 0 0}
.helper{display:flex;align-items:center;gap:10px;margin-top:12px;font-weight:700}
.helper .av{width:34px;height:34px;font-size:11px;border-width:0;margin:0}
.wait{font-weight:400;color:var(--muted);font-size:13px;margin-left:2px}
.skip{font-size:13.5px;text-decoration:underline;color:var(--muted);margin-top:2px;padding:4px 2px}
.sumbox textarea{width:100%;min-height:170px;border:1px solid var(--ink);border-radius:8px;padding:10px;font:14px/1.5 var(--f);margin-top:8px}
.aboutprod{display:inline-flex;gap:8px;align-items:center;background:var(--soft);border-radius:8px;padding:6px 10px;font-size:13.5px;margin-top:12px}
/* chat extras */
.intent{display:block;width:100%;text-align:left;border:1.5px solid var(--purple);border-radius:10px;padding:10px 12px;font-weight:700;color:var(--purple);background:var(--bg)}
.intent:hover{background:var(--purple-soft)}
.intents{display:flex;flex-direction:column;gap:6px}
.savednote{font-size:12.5px;color:var(--ok);background:var(--ok-soft);border-radius:6px;padding:4px 8px}
.savednote button{text-decoration:underline;color:inherit}
@media (max-width:700px){.sitbar{grid-template-columns:1fr 1fr}.editform{grid-template-columns:1fr}}

/* my rig page */
.rigpage{padding-bottom:90px}
.righead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0 8px}
.stat{background:var(--soft);border-radius:10px;padding:14px 16px}
.stat b{display:block;font-size:30px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.stat.alert b{color:var(--warn)}
.riggrid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:32px;margin-top:20px}
.riggrid h2{font-size:22px;font-weight:800;margin:0 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chains{display:flex;flex-direction:column;gap:12px;margin-bottom:28px}
.chain{background:var(--soft2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.chain h3{margin:0 0 10px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.flow{display:flex;align-items:center;gap:6px;overflow-x:auto;padding-bottom:4px}
.node{flex:none;width:118px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px;text-align:center;font-size:12px;line-height:1.3}
.node .sil{aspect-ratio:3/2;margin-bottom:4px}
.node.missing{border-style:dashed;border-color:var(--purple);color:var(--purple);background:var(--purple-soft);display:grid;place-items:center;min-height:98px;font-weight:700;cursor:pointer}
.flow .arr{flex:none;color:var(--muted)}
.gearlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.gear{background:var(--soft);border-radius:10px;padding:12px;display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;align-items:start}
.gear h4{margin:0;font-size:15px;line-height:1.3}
.gear .meta{font-size:12.5px;color:var(--muted);margin:2px 0 6px}
.gear .acts{display:flex;gap:6px;flex-wrap:wrap}
.addgear{border:1.5px dashed var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;margin-top:12px}
.addgear .row2{display:flex;gap:8px;flex-wrap:wrap}
.addgear input,.addgear select{border:1px solid var(--ink);border-radius:8px;padding:8px 10px;min-width:0;flex:1 1 160px;background:var(--bg)}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.side .box h4{font-size:16px}
.health .fitline{border-top:1px solid var(--line);padding:8px 0}
.health .fitline:first-of-type{border-top:0}
@media (max-width:980px){.riggrid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1 / -1}}

/* contact */
.contact{display:grid;grid-template-columns:240px minmax(0,1fr);gap:40px;padding:24px 0 80px}
.side-nav{display:flex;flex-direction:column;gap:14px;font-weight:700;font-size:15px}
.side-nav .on{color:var(--purple)}
.stepcard{border:1px solid var(--line);border-radius:10px;padding:28px clamp(16px,4vw,48px);margin-top:20px}
.avatars{display:flex}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;border:3px solid #fff;margin-left:-8px;box-shadow:0 0 0 1px var(--line)}
.avatars .av:first-child{margin-left:0}
.prog{height:8px;background:var(--line);border-radius:4px;margin:18px 0 6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--purple);transition:width .3s}
.steplbl{color:var(--purple);font-weight:600;font-size:13px}
.answered{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px}
.answered h3,.q h3{margin:0;font-size:18px;font-weight:700}
.answered p{margin:2px 0 0;font-size:14px}
.edit{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;flex:none}
.q{margin-top:22px}
.q h3::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--purple);margin-right:10px;vertical-align:middle}
.opts{display:flex;flex-direction:column;align-items:flex-start;gap:10px;margin-top:12px}
.stepfoot{display:flex;justify-content:center;gap:16px;margin-top:28px;border-top:1px solid var(--line);padding-top:18px}
.stepfoot .ghost{font-weight:700;padding:10px 18px}
.stepfoot .dis{background:var(--soft);color:#aaa;border-radius:30px;padding:10px 22px;font-weight:700}
.note{background:var(--soft);border-radius:10px;padding:12px 14px;font-size:14px;margin-top:14px}
.aitag{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;background:var(--purple);color:#fff;border-radius:4px;padding:1px 6px}

/* need help pill + drawer */
.needhelp{position:fixed;right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:40px;box-shadow:0 4px 18px rgba(0,0,0,.16);padding:6px 6px 6px 18px;font-weight:600;font-size:14px}
.needhelp .av{width:34px;height:34px;font-size:11px;border-width:2px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--bg);z-index:51;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.wide{width:min(540px,100%)}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:22px 24px 6px}
.dhead h2{margin:0;font-size:20px;font-weight:800}
.dbody{flex:1;overflow:auto;padding:8px 24px 24px;display:flex;flex-direction:column;gap:14px}
.dfoot{border-top:1px solid var(--line);padding:12px 24px;display:flex;justify-content:center;gap:16px}

/* chat widget */
.chatw{position:fixed;right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:380px;height:min(640px,calc(100% - 140px));z-index:45;border-radius:16px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.25);background:var(--bg);display:flex;flex-direction:column}
.chatw.expanded{width:min(560px,calc(100% - 48px));height:calc(100% - 48px - env(safe-area-inset-bottom,0px) - env(safe-area-inset-top,0px))}
.launch{flex:1;display:flex;flex-direction:column;background:var(--purple);color:#fff;position:relative;overflow:hidden}
.launch::before,.launch::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.launch::before{width:520px;height:520px;right:-300px;top:-120px;background:radial-gradient(circle,rgba(255,255,255,.14),rgba(255,255,255,0) 70%)}
.launch::after{width:600px;height:600px;left:-260px;top:120px;background:radial-gradient(circle,rgba(162,75,255,.55),rgba(126,0,243,0) 70%)}
.launch .top{display:flex;justify-content:flex-end;padding:16px;position:relative;z-index:1}
.launch .hello{margin-top:auto;padding:0 28px 22px;position:relative;z-index:1}
.launch .hello h2{font-size:32px;margin:0;font-weight:800}
.launch .hello p{margin:6px 0 0;font-size:17px}
.launch .startcard{background:var(--bg);color:var(--ink);margin:0 20px 22px;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.12);padding:18px 18px 14px;position:relative;z-index:1}
.launch .startcard .cta{width:100%;padding:14px;font-size:16px;border-radius:4px}
.launch .startcard p{margin:10px 0 0;font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:flex-start}
.launch .startcard #acctNote{border-top:1px solid var(--line);padding-top:10px;display:block}
.launch .startcard #acctNote.warn{color:var(--warn);font-weight:600}
.ondot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;flex:none;margin-top:5px}
.ondot.off{background:#aaa}
.chead{background:var(--purple);color:#fff;display:flex;align-items:center;gap:10px;padding:12px 12px 12px 8px;min-height:66px}
.chead .who{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.chead .who b{font-size:16px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead .who small{font-size:12px;opacity:.85;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead .hb{width:36px;height:36px;display:grid;place-items:center;border-radius:50%}
.chead .hb:hover{background:rgba(255,255,255,.15)}
.specbar{display:flex;gap:6px;align-items:center;justify-content:center;width:100%;padding:8px 12px;background:var(--purple-soft);color:var(--purple);font-weight:700;font-size:13px;border-bottom:1px solid var(--line)}
.specbar:hover{background:#e8d4fd}
.specbar #specsub{font-weight:400;color:var(--muted)}
.aiav{width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;border:2px solid #fff}
.aiav svg{width:24px;height:24px;fill:var(--purple)}
.aiav.sm{width:32px;height:32px;background:var(--purple-soft);border:0}
.aiav.sm svg{width:18px;height:18px}
.clog{flex:1;overflow:auto;padding:18px 14px;display:flex;flex-direction:column;gap:14px;background:var(--bg)}
.m{display:grid;grid-template-columns:32px minmax(0,1fr);gap:8px;align-items:start}
.m .body{min-width:0;display:flex;flex-direction:column;gap:8px}
.m .b{background:var(--bubble);border-radius:6px;padding:11px 14px;font-size:14.5px;overflow-wrap:anywhere;max-width:100%}
.m .t{font-size:12px;font-weight:600;color:var(--muted)}
.m.u{grid-template-columns:minmax(0,1fr)}
.m.u .body{align-items:flex-end}
.m.u .b{background:var(--purple-soft)}
.m.sys{grid-template-columns:1fr;text-align:center;font-size:12.5px;color:var(--muted)}
.b p{margin:0 0 .5em}.b p:last-child{margin:0}
.b ul,.b ol{margin:.2em 0 .5em;padding-left:1.2em}
.b h4{margin:.3em 0;font-size:14.5px}
.typing{display:inline-flex;gap:4px;padding:4px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:#8a8f99;animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.typing i{animation:none}.prog i{transition:none}}
.status{font-size:12px;color:var(--muted)}
.cfoot{display:flex;gap:10px;align-items:flex-end;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);position:relative}
.plus{width:44px;height:44px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none}
.cinput{flex:1;min-width:0;display:flex;align-items:flex-end;border:1.5px solid var(--line);border-radius:26px;padding:4px 4px 4px 16px;min-height:44px}
.cinput:focus-within{border-color:var(--purple-light)}
.cinput textarea{flex:1;min-width:0;border:0;outline:0;resize:none;background:none;padding:8px 0;max-height:120px;font-size:14.5px}
.sendb{width:38px;height:38px;border-radius:50%;background:var(--purple-light);display:grid;place-items:center;flex:none;color:#fff}
.sendb.on{background:var(--purple)}
.sendb svg{width:20px;height:20px}
.plusmenu{position:absolute;bottom:64px;left:12px;background:var(--bg);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:6px 0;z-index:5;min-width:230px}
.plusmenu button{display:block;width:100%;text-align:left;padding:9px 16px;font-size:14px}
.plusmenu button:hover{background:var(--soft)}
.chatbubble{position:fixed;right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;background:var(--purple);color:#fff;display:grid;place-items:center;z-index:44;box-shadow:0 6px 20px rgba(126,0,243,.45)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--purple);color:var(--purple);border-radius:20px;padding:5px 12px;font-size:13.5px;font-weight:600;background:var(--bg)}
.chip:hover,.chip[aria-pressed="true"]{background:var(--purple);color:#fff}
.chip[disabled]{opacity:.5;cursor:default}
.endnote{border:1.5px dashed var(--purple);border-radius:8px;padding:10px 12px;font-size:13px;background:var(--purple-soft)}
.composer-off{padding:12px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);text-align:center}

/* tool cards inside chat (shared with tools.js) */
.card{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px;min-width:0;font-size:13.5px}
.card h5{margin:0 0 6px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;border-radius:4px;padding:1px 6px;background:var(--soft);color:var(--muted)}
.tag.edge{background:var(--purple-soft);color:var(--purple)}
.tag.moat{background:#fff1dc;color:#9a5300}
.tag.sim{background:#eef0f4;color:#4b5563}
.mini{display:flex;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.card .mini:first-of-type{border-top:0}
.mini .info{flex:1 1 140px;min-width:0}
.mini .info div:first-child{font-weight:600;line-height:1.3}
.mini .sub{font-size:12px;color:var(--muted)}
.mini .price{font-size:14px;font-weight:800}
.btn{border:1.5px solid var(--ink);border-radius:20px;padding:3px 11px;font-size:12.5px;font-weight:700;background:var(--bg)}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--black);color:#fff;border-color:var(--black)}
.btn.primary:hover{background:#333}
.btn[disabled]{opacity:.45;cursor:default}
.tblwrap{overflow-x:auto}
table.cmp{border-collapse:collapse;font-size:12.5px;width:100%}
table.cmp th,table.cmp td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
table.cmp th{font-weight:600;color:var(--muted)}
.check{display:flex;gap:8px;align-items:flex-start;padding:4px 0}
.badge{font-size:10.5px;font-weight:800;border-radius:4px;padding:1px 6px;flex:none;margin-top:2px}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.warn{background:var(--warn-soft);color:var(--warn)}.badge.bad{background:var(--bad-soft);color:var(--bad)}
.bar2,.bar{height:7px;border-radius:4px;background:var(--soft);overflow:hidden;margin-top:3px}
.bar i,.bar2 i{display:block;height:100%;background:var(--purple)}
.reason{font-size:13px;margin:6px 0}
.reason div:first-child{display:flex;justify-content:space-between;gap:8px}
.choices{display:flex;flex-wrap:wrap;gap:6px}
.total{display:flex;justify-content:space-between;font-weight:700;border-top:1px solid var(--line);padding-top:6px;margin-top:4px}
.steps{margin:0;padding:0;list-style:none}
.steps li{display:flex;gap:8px;padding:4px 0}
.steps input{accent-color:var(--purple)}
.prow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.search{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--bg)}
.pbrand{font-size:12px;color:var(--muted)}

.testg{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:14;background:var(--ink);color:#fff;border-radius:30px;padding:8px 14px;font-size:13px;font-weight:700;display:flex;gap:6px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.feat{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.feat .h{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-weight:700}
.feat .h .n{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.feat p{margin:0;font-size:13px;color:var(--muted)}
.switch{display:flex;align-items:center;gap:10px;font-weight:600}
.switch input{width:20px;height:20px;accent-color:var(--purple)}
/* Home page */
.home .hometitle{text-align:center;font-size:clamp(26px,3.4vw,38px);font-weight:800;margin:22px 0 18px}
.banners{display:grid;grid-template-columns:1fr 2.4fr 1fr;gap:20px;padding:0 0 6px;overflow-x:auto;scroll-snap-type:x mandatory}
.banner{border-radius:14px;min-height:clamp(170px,22vw,300px);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;color:#fff;text-align:left;scroll-snap-align:center}
.banner.b1{background:linear-gradient(160deg,#8a5a2b,#3b2414)}.banner.b3{background:linear-gradient(160deg,#4a4038,#1d1916)}

.bsm{font-size:15px;font-weight:700}.bbig{font-size:clamp(26px,3.6vw,52px);font-weight:800;line-height:1}
.bbig2{font-size:clamp(22px,3vw,40px);font-weight:800;line-height:1.05;text-transform:uppercase}
.bbrand{font-size:clamp(36px,6vw,78px);font-weight:800;color:#ff5fc8;text-transform:uppercase;letter-spacing:-.02em;line-height:.95;text-shadow:0 4px 0 #b3157f}
.bdate{font-weight:800;letter-spacing:.3em}.bnote{font-size:11px;opacity:.75}
.bbadge{position:absolute;right:5%;top:50%;transform:translateY(-50%);width:clamp(80px,11vw,150px);aspect-ratio:1;border-radius:50%;border:4px solid #ff5fc8;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;text-transform:uppercase;font-size:12px;box-shadow:0 0 18px #ff5fc8}

.usp{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;padding:22px 24px 30px;max-width:1240px;margin:0 auto}
.uspi{display:flex;gap:10px;align-items:center;font-size:15px}
.hex{width:48px;height:48px;flex:none;display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(135deg,#3b82f6,#a855f7);clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)}
.uspi:nth-child(2) .hex{background:linear-gradient(135deg,#22c55e,#84cc16)}.uspi:nth-child(3) .hex{background:linear-gradient(135deg,#f472b6,#a855f7)}.uspi:nth-child(4) .hex{background:linear-gradient(135deg,#f97316,#facc15)}.uspi:nth-child(5) .hex{background:linear-gradient(135deg,#2563eb,#38bdf8)}
.dealband{background:#6209b5;color:#fff;padding:26px 0 30px}.dealband h2{font-size:clamp(28px,4vw,46px);font-weight:800;color:#ff5fc8;text-transform:uppercase;text-align:center;margin:0}

.dealrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:12px}

.dctop{display:flex;gap:6px;flex-wrap:wrap}.dcname{font-weight:700;text-align:left;line-height:1.25}.dcsub{font-size:12.5px}
.homecats{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:10px}

.dealfilters select{border:1px solid var(--ink);border-radius:6px;padding:6px 8px;font:inherit;background:var(--bg);color:var(--ink)}
.wrapgrid{margin-top:10px}.dealrow.wrapgrid .dealcard{border:1px solid var(--line)}
.bell{font-size:16px;width:32px;height:32px;border-radius:50%;flex:none}.bell:hover{background:var(--soft)}
.dropb{display:inline-block;background:var(--ok-soft);color:var(--ok);font-weight:700;font-size:12px;border-radius:6px;padding:1px 7px}

.sumlines{white-space:pre-line}
.srctext{word-break:break-all}
.simbox{flex-wrap:wrap;gap:6px}

.dealnote{background:var(--ok-soft);color:var(--ok);border-radius:6px;padding:4px 8px;font-size:13px;margin-bottom:6px}

function scoreQ(p,q){
  if(!q)return 1;const words=q.toLowerCase().split(/\s+/).filter(w=>w.length>1&&!["for","the","a","and","with","my","to"].includes(w));
  const hay=(p.n+" "+p.b+" "+p.tags.join(" ")+" "+CATS[p.c]+" "+(p.sub||"")+" "+(TOPS[p.top]?.en||"")+" "+(TOPS[p.top]?.de||"")+(p.tv?" "+p.tv.sub:"")).toLowerCase();
  return words.reduce((a,w)=>a+(hay.includes(w)?1:hay.includes(w.replace(/s$/,""))?1:0),0);
}
const subMatch=(p,s)=>{const x=s.toLowerCase();return (p.sub||"").toLowerCase()===x||(p.tv&&((p.tv.sub||"").toLowerCase()===x||(p.tv.crumb||[]).some(c=>c.toLowerCase()===x)))};
function baseList(v,skip){
  let l=P.map(p=>({p,s:scoreQ(p,v.q)})).filter(o=>o.s>0).map(o=>o.p);
  if(v.sit&&skip!=="sit")l=l.filter(p=>p.sit?.includes(v.sit));
  if(v.cats.length)l=l.filter(p=>v.cats.includes(p.c));
  if(v.top&&skip!=="top")l=l.filter(p=>p.top===v.top);
  if(v.sub&&skip!=="sub"&&skip!=="top")l=l.filter(p=>subMatch(p,v.sub));
  if(v.src&&skip!=="src")l=l.filter(p=>v.src==="verified"?!!p.tv:!p.tv);
  if(v.brand&&skip!=="brand")l=l.filter(p=>p.b===v.brand);
  if(v.inst&&skip!=="inst"){const tops=INST_TOPS[v.inst]||[];if(tops.length)l=l.filter(p=>tops.includes(p.top)&&(v.inst!=="vocals"||p.top==="mics"||/vocal/i.test(p.sub||"")))}
  if(v.min)l=l.filter(p=>p.p>=+v.min); if(v.max)l=l.filter(p=>p.p<=+v.max); if(v.stock)l=l.filter(p=>p.st>0);
  return l;
}
function resultsList(){

}

function rigFromOrders(){const owned=new Set(S.rig.map(r=>r.id));return ORDERS.flatMap(o=>o.items.map(([id])=>({id,o}))).filter(x=>!owned.has(x.id)&&BY[x.id].c!=="accessories")}
function rigOverview(){
  const health=rigHealth(),chains=rigChains(),sug=rigSuggestions();
  const rm=S.variant==="A"?[]:upgradeRoadmap(),steps=rm.flatMap(r=>r.steps);
  const topicOf=id=>{const p=BY[id];if(!p)return null;const k=p.cp?.kind;return k==="psu"||k==="battery"?"power":k==="amp"?"amp":k==="mic"?"mic":k==="interface"?"interface":null};
  const iss=new Map();

    c.urg=Math.min(c.urg,o.urg);if(o.s==="bad")c.s="bad";for(const f in o)if(c[f]===undefined)c[f]=o[f]};
  const URG={power:2,amp:2,interface:1,phantom:1,gain:2,usb:2,xlr:3,hp:3,hp250:6,strings:4};
  for(const h of health){if(h.s==="ok"||h.k==="war"||h.k==="ret"||h.k==="none")continue;
    const one=["power","amp","interface","strings"].includes(h.k);

  for(const c of chains)for(const n of c.flow)if(n.missing){const k=MISS[n.missing]||"miss:"+n.missing;add(k,{k,urg:k==="mic"?5:2,ask:n.ask,miss:n.missing})}

  for(const o of sug){const t=topicOf(o.p.id);if(t&&iss.has(t)){const c=iss.get(t);if(!c.rec||BY[c.rec].cp?.kind==="battery")c.rec=o.p.id}}

    const ask=(l,q)=>({label:l,attr:`data-ask="${esc(q)}"`});
    const ord=i.k!=="power"&&ordered.find(x=>x.id===i.rec||topicOf(x.id)===i.key);
    if(ord)return {...i,rec:ord.id,title:i.k==="mic"?"Nothing plugged into your mic input":"Missing: "+(i.miss?esc(i.miss):pn(ord.id)),line:`Your <b>${pn(ord.id)}</b> is on its way (order ${esc(ord.o.id)}, ${esc(ord.o.status.toLowerCase())}). Add it to your rig so the advisor checks against it.`,act:{label:"Add to rig",attr:`data-rig-order="${ord.id}|${ord.o.id}"`}};
    if(i.k==="power"){const ped=rigItems().filter(x=>x.cp?.kind==="pedal").map(x=>esc(x.name)).join(", ");
      return {...i,title:i.s==="bad"?"Your power supply can't run a pedal":"Your pedals have no power supply",
        line:i.s==="bad"?esc(i.text):`${ped} ${i.text&&/^1 pedal/.test(i.text)?"runs":"run"} on 9 V batteries.${i.rec?` Recommended: a supply such as <b>${pn(i.rec)}</b> (${pp(i.rec)}).`:" A 9 V supply saves batteries and noise."}${i.stop?` Until then, a 9 V battery (${pn(i.stop)}, ${pp(i.stop)}) does the job.`:""}`,
        act:i.s==="bad"?ask("Ask the advisor",i.ask):i.rec?{label:"View the supply",attr:`data-detail="${i.rec}"`}:ask("Which supply?",i.ask)}}
    if(i.k==="war")return {...i,title:`Warranty ends in ${i.days} days`,line:`${esc(i.name)}: covered until ${isoDay(i.end)}. Check it works properly now.`,act:ask("What to check",`My ${i.name}'s warranty ends on ${isoDay(i.end)}. What should I check before then?`)};
    if(i.k==="ret")return {...i,title:`Return window: ${i.days} days left`,line:`${esc(i.name)}: you can still return it until ${isoDay(i.end)}. Test it properly before then.`,act:ask("What to test",`I can still return my ${i.name} for ${i.days} days. What should I test before I decide to keep it?`)};
    if(i.k==="strings")return {...i,title:"Time for new strings",line:esc(i.text),act:ask("Pick strings",i.ask)};
    if(i.k==="mic")return {...i,title:"Nothing plugged into your mic input",line:`Your interface has a mic input but no microphone.${i.rec?` A good match: <b>${pn(i.rec)}</b> (${pp(i.rec)}).`:""}`,act:view||ask("Ask the advisor",i.ask)};
    if(i.k==="amp")return {...i,title:"No amp yet",line:`${esc(i.text||"Your guitar has nothing to play through.")}${i.rec?` Recommended: <b>${pn(i.rec)}</b> (${pp(i.rec)}).`:""}`,act:view||ask("Ask the advisor",i.ask)};
    if(i.k==="need")return {...i,title:`Missing: ${pn(i.rec)}`,line:`${esc(i.why.charAt(0).toUpperCase()+i.why.slice(1))} (${pp(i.rec)}).`,act:view};

  else if(cur==="sent")q=`<div class="q"><h3>Sent (simulated)</h3><p>${e?esc(e.name):"An adviser"} has your summary and ${REPLY[c.method]}: ${WAIT[c.method][S.online?0:1]}.</p><button class="btn" data-step-reset ${W}>Start a new request</button></div>`;

   ${e?`<div class="helper">${avatar(exp)} ${esc(e.name.split(" ")[0])} from the ${TEAM[exp]} team will help you.</div>`:""}

function applyProposal(pr){
  if(pr.type==="profile"){const {ins,gen}=pr.data,m=S.music;
    if(ins){let t=m.instruments.find(z=>z.id===m.active&&z.kind===ins.kind)||m.instruments.find(z=>z.kind===ins.kind);
      if(!t){t={id:newInsId(),kind:ins.kind,label:"",level:"",uses:[],genres:[],artists:[],budget:"",goals:"",notes:""};m.instruments.push(t)}
      for(const [k,v] of Object.entries(ins)){if(k==="kind")continue;t[k]=Array.isArray(v)?[...new Set([...(t[k]||[]),...v])]:v}}
    for(const [k,v] of Object.entries(gen))m.general[k]=Array.isArray(v)?[...new Set([...(m.general[k]||[]),...v])]:v;
    autoLinkGear();saveMusic();return "Saved to your Music Profile";}
  if(pr.type==="rig-add"){const {id,name,kind,insKind}=pr.data,ins=insKind&&S.music.instruments.find(z=>z.kind===insKind);
    if(id){if(!S.rig.some(r=>r.id===id))S.rig.push({id,since:TODAY.toISOString().slice(0,7),bought:"elsewhere",...(ins?{inst:[ins.id]}:{})})}
    else addCustomGear(ins?.id||"",{brand:"",model:name,kind:kind||"other",specs:""});
    store.set("rig",S.rig);autoLinkGear();saveMusic();return "Added to My rig";}
  if(pr.type==="rig-rm"){S.rig.splice(pr.data.idx,1);store.set("rig",S.rig);saveMusic();return "Removed from My rig";}
  if(pr.type==="alert"){if(!S.basket.some(b=>b.id===pr.data.id)&&!isSaved(pr.data.id))savePick(pr.data.id,true);createAlert(pr.data.id,pr.data.mode,pr.data.threshold);updateAlertCount();return "Price tracked: see the bell on the item in Saved or your basket";}
}

function md(src){
  const lines=esc(src).split("\n");let out="",list=null;
  const inl=s=>s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<i>$2</i>").replace(/`([^`]+)`/g,"<code>$1</code>");
  const close=()=>{if(list){out+=`</${list}>`;list=null}};
  for(const l of lines){let m;
    if((m=l.match(/^\s*[-*•]\s+(.*)/))){if(list!=="ul"){close();out+="<ul>";list="ul"}out+=`<li>${inl(m[1])}</li>`}
    else if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){if(list!=="ol"){close();out+="<ol>";list="ol"}out+=`<li>${inl(m[1])}</li>`}
    else if((m=l.match(/^#{1,4}\s+(.*)/))){close();out+=`<h4>${inl(m[1])}</h4>`}
    else if(!l.trim())close(); else{close();out+=`<p>${inl(l)}</p>`}}
  close();return out;
}

function rulesText(){
  return `You are Thomann's AI advisor inside the shop's Live chat (a concept prototype of the Thomann music shop). All catalogue, stock, order and rig data is demo data supplied by this page.

HOW TO WORK
- CATALOGUE AND EVIDENCE: recommend only products in the catalogue below or returned by search_products; never invent products, prices or specs. Use search_products filters for hard constraints (max_price, in_stock, top_category, requires such as ['USB-C']). VERIFIED products were read from thomann.de on the date shown; SNAPSHOT products are deal prices seen on a thomann.de listing that day (price only, may have changed): call them "€X on 6 Nov", never current or guaranteed. DEMO products have simulated ratings. Base compatibility only on check_fit (demo products) or listed specs (verified products).
- SAVINGS AND DEALS: when the customer is price-sensitive (cheaper, discount, deal, budget, bundle or separately, tell me when it's cheaper), use verified savings only: call deals for offers on the products or needs in question, and never recommend an unrelated product just because it's discounted. Always name the comparison basis exactly (30-day best price, manufacturer's list price UVP, or the verified sum of a bundle's parts); say "Save €X" only when a tool gives a verified saving, otherwise call it a Recommended Setup with the sum of prices. B-Stock is never new: say B-Stock and quote its condition. For a complete setup call build_setup with the goal and budget. For "tell me when it's cheaper" call price_alert: the customer confirms, alerts show only in this page, and there are no emails, push notifications or automatic price checks in the prototype. Offer cheaper alternatives at most once per topic. For a full basket, offer review_setup.
- DECISION CONFIDENCE: notice what stops the customer deciding (compatibility doubt, confusion between options, missing knowledge, price or hidden costs, sound or feel, wanting reassurance) and address that barrier: check_fit for compatibility, compare_products with use_case for confusion, a plain explanation for knowledge, build_setup with product_id for hidden costs, deals for price. Sound and feel can't be verified here: say so in a few words. When they seem ready, offer readiness_summary. Mention the live agent only when a LIVE AGENT condition applies or when asked; never push one on someone ready to buy.
- SETUP BUILDER: one tool, build_setup, for every complete-setup request, with the same three levels everywhere: Lowest Cost (only what's needed, cheapest), Best Value (needed plus recommended), Upgrade-Friendly (room to grow). Start from a goal (goal + budget), a main product (product_id: what else it needs) or items you chose via search_products (items with roles; leave room for cables). It skips what they own or have in the basket and stays within budget unless they allow more. Explain additions in a few words, never push expensive items, never add to the basket yourself.
- LONG TERM AND TRUST: use upgrade_roadmap for "what next" questions. Projects and price alerts are the customer's to create; suggest them at most once. No invented urgency or discounts, no upselling beyond what the goal needs, no hidden basket changes, no marketing messages.
- Product facts (prices, specs, stock, compatibility) come ONLY from the catalogue below and your tools. Never invent products, prices or specs. If something isn't in the catalogue, say so and offer the closest item.

  else if(d.sendContact!==undefined){const c=ctxOf(d.where);c.summary=$("#sum-"+d.where).value;c.sent=true;refreshSteps(d.where);toast("Sent to your adviser (simulated)")}
  else if(d.sit){S.view.sit=S.view.sit===d.sit?"":d.sit;render()}
  else if(d.expert){const p=BY[d.expert];S.contact={enquiry:"Product advice",category:DEPT(p.c),need:null,method:null,product:p.id};go({name:"contact"})}
  else if(d.consult!==undefined){openConsult()}
  else if(d.handover){handover(d.handover,window.__sums?.[d.sid]);a.disabled=true}
  else if(d.backai!==undefined)backToAi();
  else if(d.cb){const box=a.closest(".card").querySelector("[data-cbs]");box.textContent=d.cb==="call"?"Call back requested (simulated). A specialist will call you after 9:00 with this chat's summary.":"Message saved (simulated). A specialist will reply by email after 9:00.";a.parentElement.querySelectorAll("button").forEach(b=>b.disabled=true)}
  else if(d.platform!==undefined){closeDrawer();openChat();$("#chatw").classList.add("expanded")}
  else if(d.prefill){if(!S.started)startConversation();else setChat("open");cin.value=d.prefill;sendState();setTimeout(()=>{cin.focus();cin.setSelectionRange(cin.value.length,cin.value.length)},60)}
  else if(d.spec!==undefined){$("#plusmenu").hidden=true;handover()}
  else if(d.save){isSaved(d.save)?unsavePick(d.save):savePick(d.save)}
  else if(d.saveAll){const l=JSON.parse(d.saveAll);let n=0;for(const id of l)if(savePick(id,true))n++;toast(n?`Saved ${n} item${n>1?"s":""} from this setup`:"This setup is already saved");a.textContent="★ Setup saved";a.setAttribute("aria-pressed","true")}
  else if(d.sumq){S.sumHidden=false;store.set("sumHidden",false);sq.value=d.sumq;go({name:"results",q:d.sumq})}
  else if(d.sumhide!==undefined){S.sumHidden=true;store.set("sumHidden",true);render()}
  else if(d.sumshow!==undefined){S.sumHidden=false;store.set("sumHidden",false);render()}
  else if(d.sumask!==undefined){const n=S.sumNow;if(n)S.sumCtx={label:n.t.label,txt:n.txt};if(!S.started)startConversation();else setChat("open");setCtab("chat");cin.value=n?`About ${n.t.label}: `:"";sendState();setTimeout(()=>{cin.focus();cin.setSelectionRange(cin.value.length,cin.value.length)},60)}
  else if(d.top){closeDrawer();ac.hidden=true;$("#shopDD").hidden=true;sq.value="";go({name:"results",top:d.top})}
  else if(d.topsub){const [tp,sb]=d.topsub.split("|");sq.value="";go({name:"results",top:tp,sub:sb})}
  else if(d.more!==undefined){S.view.limit+=24;render()}
  else if(d.import!==undefined){const r=importCatalogue($("#impText").value);render();const o=$("#impOut");
    o.innerHTML=`<div class="box" style="margin-top:10px"><b>${r.added} added, ${r.updated.length} updated, ${r.errors.length} rejected.</b>${r.updated.map(u=>`<div>${esc(u.name)}: ${eur(u.old)} → ${eur(u.new)} (verified ${esc(u.verified)})</div>`).join("")}${r.errors.length?`<ul class="imperr">${r.errors.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}</div>`;
    if(typeof onPricesImported==="function")onPricesImported(r.updated)}
  else if(d.bell){const id=d.bell;if(alertOf(id)){saveAlerts(getAlerts().filter(x=>x.id!==id));toast("Stopped tracking "+BY[id].n)}else{createAlert(id,"drop");toast("Tracking the price: you'll see it here if a later verified price is lower")}
    updateAlertCount();a.outerHTML=bellBtn(id)}
  else if(d.simGo!==undefined){const id=$("#simItem").value,v=parseFloat(String($("#simPrice").value).replace(",","."));if(!id||!(v>0)){toast("Pick a tracked item and a price");return}const f=simulatePrice(id,v);toast(f.length?"Simulated: alert fired":"Simulated "+eur(v)+": not lower than the tracked price");openGuide()}
  else if(d.review!==undefined){S.review=null;S.reviewDec=null;go({name:"review"})}
  else if(d.rvRedo!==undefined){S.review=null;S.reviewDec=null;render()}
  else if(d.rvYes!==undefined){const pr=S.review.proposals[+d.rvYes];applyCartProposal(pr);store.set("basket",S.basket);bcount();S.reviewDec[pr.n]="yes";render();toast("Basket updated")}
  else if(d.rvNo!==undefined){S.reviewDec[+d.rvNo]="no";render()}
  else if(d.goal!==undefined){const g=$("#goalSel").value;if(!g){toast("Choose a goal first");return}setupTrigger();S.view.goal=g;S.view.budget=$("#goalBudget").value.replace(/\D/g,"");render()}
  else if(d.addsetup){for(const [id,q] of JSON.parse(d.addsetup))addBasket(id,q);toast("Setup added to your basket")}
  else if(d.rtpTier){S.rtpTier=d.rtpTier;render()}
  else if(d.rtpAllow!==undefined){S.rtpAllow=true;render()}
  else if(d.rtpAdd){setupTrigger();const ticked=[...new Set([...a.closest(".rtp").querySelectorAll("[data-rtp-item]:checked")].map(x=>x.dataset.rtpItem))];addBasket(d.rtpAdd);ticked.forEach(id=>addBasket(id));
    const r=readyToPlay(d.rtpAdd,S.rtpBudget||null,S.rtpAllow),ess=(r.tiers[S.rtpTier]||r.tiers.bal).items.filter(i=>i.lvl==="Essential").map(i=>i.id);if(ess.every(id=>ticked.includes(id)))track("setup_completed",{anchor:d.rtpAdd,tier:S.rtpTier,items:ticked.length+1});toast("Added to your basket")}
  else if(d.rtpProj){const ticked=[...new Set([...a.closest(".rtp").querySelectorAll("[data-rtp-item]:checked")].map(x=>x.dataset.rtpItem))];const p=createProject(BY[d.rtpProj].n+" setup",[[d.rtpProj,1],...ticked.map(id=>[id,1])]);track("setup_completed",{anchor:d.rtpProj,saved:true});toast("Saved as project “"+p.name+"”")}
  else if(d.projSetup){const o=JSON.parse(d.projSetup);const p=createProject(o.name,o.items);track("setup_completed",{saved:true});toast("Saved as project “"+p.name+"”")}
  else if(d.projNew!==undefined){if(!S.basket.length){toast("Your basket is empty: add items first, or save a setup from the Deals page");return}createProject($("#projName").value.trim()||"My project",S.basket.map(b=>[b.id,b.qty]));render();toast("Project saved")}
  else if(d.projCart){const p=getProjects().find(x=>x.id===d.projCart);p.items.forEach(([id,q])=>addBasket(id,q));toast("Project added to your basket")}
  else if(d.projDel){if(!confirm("Delete this project?"))return;saveProjects(getProjects().filter(x=>x.id!==d.projDel));render()}
  else if(d.projRmitem){const [pid,k]=d.projRmitem.split("|"),l=getProjects(),p=l.find(x=>x.id===pid);p.items.splice(+k,1);p.updated=new Date().toISOString().slice(0,10);saveProjects(l);render()}
  else if(d.dashReset!==undefined){if(!confirm("Delete all recorded events and A/B sessions on this device?"))return;ls.set(EV_KEY,[]);ls.set(AB_KEY,[]);render()}
  else if(d.specConsult!==undefined){openConsult()}
  else if(d.perms!==undefined){openPerms()}
  else if(d.liveAgent!==undefined){const p=BY[d.liveAgent];closeDrawer();if(p){S.viewing=p.id;if(p.p>HIGH_PRICE)flagAgent("price",true)}if(!S.started)startConversation();else setChat("open");handover(p?DEPT2EXP[DEPT(p.c)]:undefined)}
  else if(d.advmode){store.set("advmode",d.advmode);renderMode();if(S.started)sysLine(d.advmode==="beginner"?"Beginner mode: step-by-step guidance and setup completeness checks.":"Experienced mode: parameters, stock and delivery, and sound comparisons.")}
  else if(d.notright){const n=+d.notright;if(S.wrong.has(n)){S.wrong.delete(n);a.setAttribute("aria-pressed","false")}else markWrong(n)}
  else if(d.anchor!==undefined){const id=$("#anchorSel").value;if(!id){toast("Choose a product first");return}S.view.anchor=id;S.rtpBudget=+($("#anchorBudget").value.replace(/\D/g,""))||null;S.rtpAllow=false;render()}
  else if(d.abSave!==undefined){const g=n=>document.querySelector(`[name="${n}"]:checked`)?.value||$("#"+n)?.value;const rec=recordABSession({taskCompleted:g("abTask"),compatAccuracy:g("abCompat"),trust:g("abTrust"),usefulness:g("abUse"),willingness:g("abWill"),handoffHelpful:g("abHand")});closeDrawer();toast(`Session recorded for variant ${rec.variant}`)}
  else if(d.ctab)setCtab(d.ctab);
  else if(d.pickStar){const pk=S.picks.find(x=>x.id===d.pickStar);if(pk){pk.star=!pk.star;savePicks();if(S.ctab==="picks")renderPicksPanel();if(S.view.name==="picks")render()}}
  else if(d.pickRm)unsavePick(d.pickRm);
  else if(d.pickFit){S.pickFit=S.pickFit===d.pickFit?null:d.pickFit;render()}
  else if(d.pickCmp!==undefined){if(S.pickSel.length>=2){S.pickCmp=[...S.pickSel];render();setTimeout(()=>$(".cmpbox")?.scrollIntoView({behavior:"smooth",block:"start"}),30)}}
  else if(d.pickCmpclose!==undefined){S.pickCmp=null;render()}
  else if(d.pickClearsel!==undefined){S.pickSel=[];render()}
  else if(d.picksClear!==undefined){if(confirm("Remove all "+S.picks.length+" saved products?")){const was=S.picks.map(x=>x.id);S.picks=[];S.pickSel=[];S.pickCmp=null;savePicks();was.forEach(syncSave);render();renderPicksPanel();toast("Saved list cleared")}}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){closeDrawer();ac.hidden=true}
  if(e.key==="Enter"&&e.target.matches(".row"))go({name:"product",id:e.target.dataset.detail});
});
function refreshSteps(where){
  if(where==="page")$("#stepcard").innerHTML=stepCardHtml(S.contact,"page");
  else{const h=$("#hsteps");if(h)h.innerHTML=stepCardHtml(S.helpCtx,where)}
}
const ctxOf=where=>where==="page"?S.contact:S.helpCtx;
$("#shopBtn").onclick=()=>{const dd=$("#shopDD");dd.innerHTML=`<button data-go="categories"><b>All categories</b></button><button data-go="deals"><b>Deals & B-Stock</b></button><button data-go="setup"><b>Setup Builder</b></button>`+TAX.map(x=>`<button data-top="${x.id}">${esc(x.en)}</button>`).join("");dd.hidden=!dd.hidden};
$("#svcBtn").onclick=()=>{$("#svcDD").hidden=!$("#svcDD").hidden};
$("#accBtn").onclick=()=>{$("#accDD").hidden=!$("#accDD").hidden};
$("#needhelp").onclick=openHelpDrawer;
$("#nhav").innerHTML=["recording","guitars","keys"].map(k=>avatar(k)).join("");
$("#testg").onclick=openGuide;
$("#chatbubble").onclick=()=>setChat("open");
$("#startConv").onclick=()=>{resetChat();startConversation(S.chatCtx)};
$("#specBtn").onclick=()=>handover();
$("#plus").onclick=()=>{$("#plusmenu").hidden=!$("#plusmenu").hidden};
$("#chatw").addEventListener("click",e=>{
  const b=e.target.closest("[data-chat]");if(!b)return;
  if(b.dataset.chat==="min")setChat("min");
  if(b.dataset.chat==="expand")$("#chatw").classList.toggle("expanded");
  if(b.dataset.chat==="back"){if(S.ctl)S.ctl.abort();S.started=false;setChat("open")}
});
const cin=$("#cin");
function sendState(){$("#sendb").classList.toggle("on",!!cin.value.trim())}
cin.addEventListener("input",()=>{cin.style.height="auto";cin.style.height=Math.min(cin.scrollHeight,120)+"px";sendState()});
cin.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("#cform").requestSubmit()}});
$("#cform").addEventListener("submit",e=>{e.preventDefault();const t=cin.value;cin.value="";cin.style.height="auto";sendState();send(t)});
$("#stopb").onclick=()=>S.ctl&&S.ctl.abort();
$("#focusSel").onchange=e=>{S.music.active=e.target.value||null;saveMusic();if(S.view.name==="profile")render();const a=activeIns();if(S.started)sysLine("Now talking about: "+(a?insName(a):"all instruments"))};

/* ---------------- Event hooks (anonymous) ---------------- */
{const _add=addBasket;addBasket=function(id,qty=1){_add(id,qty);track("add_to_cart",{id,qty,price:BY[id]?.p,recommended:sessionRecs.has(id),cartValue:+S.basket.reduce((a,b)=>a+BY[b.id].p*b.qty,0).toFixed(2)})};
 const _save=savePick;savePick=function(id,quiet){const r=_save(id,quiet);if(r)track("product_saved",{id});return r};
 const _alert=createAlert;createAlert=function(...x){const r=_alert(...x);track("price_alert_created",{id:x[0],mode:x[1]||"drop"});return r};
 const _start=startConversation;startConversation=function(ctx){_start(ctx);S.answers=0;track("chat_started")};
 const _hand=handover;handover=async function(dept,summary){track("human_handoff_requested",{dept:dept||null});return _hand(dept,summary)};}
document.addEventListener("click",e=>{
  if(e.target.closest("[data-opt]")&&!S.busy){S.answers=(S.answers||0)+1;if(S.answers===2)track("needs_assessment_completed",{via:"interview"})}
  const x=e.target.closest("a.extlink[data-ext]");if(x)track("thomann_product_link_clicked",{id:x.dataset.ext});
  if(e.target.closest("[data-pick-fit]"))track("compatibility_checked",{via:"saved"});
  if(e.target.closest("[data-pick-cmp]"))track("product_compared",{ids:S.pickSel.slice()});
},true);
new MutationObserver(()=>{if(S.mode==="human"&&!S.__handDone){S.__handDone=true;track("human_handoff_completed",{simulated:true})}if(S.mode!=="human")S.__handDone=false}).observe(document.getElementById("who"),{childList:true,subtree:true});

/* ---------------- Boot ---------------- */
const hadMusic=!!store.get("music",null);S.music=migrateMusic();autoLinkGear();syncLegacy();store.set("music",S.music);updateFocusBar();
if(VISITOR.returning&&hadMusic&&S.music.instruments.length)track("returning_profile_loaded",{instruments:S.music.instruments.length});
bcount();updateOnline();updateAcct();updatePickCount();updateAlertCount();render();
async function bootAI(){
  sample=null;S.toolsOK=null;toolList=TOOLS;
  if(!window.claude){aiReason="no_claude";sampleState="none";updateAcct();return}
  window.claude.use("permissions").then(p=>{permNS=p;updateAcct()}).catch(()=>{});
  try{sample=await window.claude.use("sample")}catch(e){sample=null}
  if(!sample){aiReason="signed_out";sampleState="none";updateAcct();return}
  try{const lim=await sample.limits();S.toolsOK=!!lim.tools;if(lim.tools&&lim.tools.maxCount<TOOLS.length)toolList=TOOLS.slice(0,lim.tools.maxCount)}
  catch(e){S.toolsOK=null}/* unknown: try tools; a tools_unavailable answer switches to plain mode */
  aiReason=null;sampleState="ready";updateAcct();
}
bootAI();
